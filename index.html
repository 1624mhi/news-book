<script>
const EMBED = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Kuala_Lumpur'});

/* ---------- 状態（保存データ） ---------- */
const KEY = 'newsbook-v1';
let st = {bookmarks:[], words:[], marks:[], quiz:{}, opinions:[], follows:[], quizDays:{}};
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e) {}
st.quiz = st.quiz || {}; st.opinions = st.opinions || []; st.follows = st.follows || []; st.quizDays = st.quizDays || {};
let db = null, stateRef = null, remoteReady = false, writing = Promise.resolve(), saveTimer = null;
function setSync(t){ $('#sync').textContent = t; }
const BADGES = [
  ['first','🌱','はじめての予想','予想を1問答える'],
  ['s3','🔥','3日連続','3日続けて予想する'],
  ['s7','🔥','1週間連続','7日続けて予想する'],
  ['all','🎯','今日を制覇','その日の予想を全部答える'],
  ['hit10','🏹','的中10回','予想を10回当てる'],
  ['world','🌏','世界一周','日本・マレーシア・世界の話をそれぞれ予想する'],
  ['words10','📚','単語コレクター','単語を10個ためる'],
  ['marks5','🖍','マーカー名人','マーカーを5か所引く'],
  ['op5','💬','自分の意見','「あなたはどう思う？」に5回答える'],
  ['fol3','🔎','追いかける人','3つの話題を追いかける'],
];
function earnedBadges(){
  st.hits = st.hits || []; st.regs = st.regs || [];
  (D.stories||[]).forEach(s => { const a = s.quiz ? st.quiz[qkey(s)] : null; if(a == null) return;
    if(a === s.quiz.answer && !st.hits.includes(qkey(s))) st.hits.push(qkey(s));
    if(!st.regs.includes(s.region)) st.regs.push(s.region); });
  const qs = (D.stories||[]).filter(s => s.quiz), k = streak().n;
  const ok = {first: Object.keys(st.quiz).length >= 1, s3: k >= 3, s7: k >= 7,
    all: qs.length > 0 && qs.every(s => st.quiz[qkey(s)] != null), hit10: st.hits.length >= 10,
    world: ['日本','マレーシア','世界'].every(r => st.regs.includes(r)), words10: st.words.length >= 10,
    marks5: st.marks.length >= 5, op5: st.opinions.length >= 5, fol3: st.follows.length >= 3};
  return BADGES.filter(b => ok[b[0]]).map(b => b[0]);
}
let badgeReady = false;
function checkBadges(){
  st.badges = st.badges || [];
  const now = earnedBadges(), fresh = now.filter(id => !st.badges.includes(id));
  if(!fresh.length) return false;
  st.badges = st.badges.concat(fresh);
  if(badgeReady) fresh.forEach((id, i) => { const b = BADGES.find(x => x[0] === id); setTimeout(() => badgeToast(b), 700 + i*1800); });
  return true;
}
function badgeToast(b){ const d = document.createElement('div'); d.className = 'badgetoast'; d.innerHTML = `<span class="be">${b[1]}</span><span><small>バッジを手に入れました</small><b>${esc(b[2])}</b></span>`; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function badgesHTML(){
  const have = st.badges || [];
  return `<div class="badges">${BADGES.map(b => `<div class="badge${have.includes(b[0])?' on':''}" title="${esc(b[3])}"><span class="be">${have.includes(b[0])?b[1]:'🔒'}</span><b>${esc(b[2])}</b><small>${esc(b[3])}</small></div>`).join('')}</div>`;
}
function save(){
  checkBadges();
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {}
  if(!stateRef || !remoteReady) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(st));
    writing = writing.then(() => stateRef.set(body)).then(() => setSync('どの端末でも同期されます'))
      .catch(e => setSync(e && e.code === 'quota_exceeded' ? '保存の上限に達しました。古い単語を削除してください' : '同期に失敗しました。この端末には保存されています'));
  }, 600);
}

/* ---------- 号（エディション） ---------- */
let D = EMBED, editions = [{date:EMBED.date, count:EMBED.stories.length, titles:EMBED.stories.slice(0,3).map(s=>s.title)}];
const cache = {[EMBED.date]: EMBED};
async function getEdition(date){
  if(!cache[date] && db){
    try { const s = await db.doc('editions/' + date).get(); if(s.exists) cache[date] = s.data(); } catch(e) {}
  }
  if(!cache[date] && window.NEWSBOOK_SITE){
    try { const r = await fetch('editions/' + date + '.json'); if(r.ok) cache[date] = await r.json(); } catch(e) {}
  }
  return cache[date];
}
async function openEdition(date){
  if(!cache[date] && db){
    try { const s = await db.doc('editions/' + date).get(); if(s.exists) cache[date] = s.data(); } catch(e) {}
  }
  if(!cache[date] && window.NEWSBOOK_SITE){
    try { const r = await fetch('editions/' + date + '.json'); if(r.ok) cache[date] = await r.json(); } catch(e) {}
  }
  if(cache[date]){ D = cache[date]; renderEdition(); }
}
function renderEditionSelect(){
  $('#edsel').innerHTML = editions.map(e => `<option value="${esc(e.date)}" ${e.date===D.date?'selected':''}>${esc(e.date.replace(/-/g,'.'))}${e.date===editions[0].date?'（最新）':''}</option>`).join('');
}
$('#edsel').addEventListener('change', e => openEdition(e.target.value));

  st.marks.forEach(m => { const t = esc(m.text); if(t.length > 1 && html.includes(t)) html = html.split(t).join(`<mark>${t}</mark>`) });

}
function renderFilters(){
  $('#filters').innerHTML = regions.map(r => `<button class="chip" type="button" data-r="${r}" aria-pressed="${r===filter}">${r}</button>`).join('') +

}

let sample = null;

function figHTML(f){
  if(!f) return '';

  }

async function loadThread(s){
  const box = $('#tl-' + s.id); if(!box || !s.thread) return;
  const past = [];
  for(const e of editions){
    if(e.date >= D.date) continue;
    const ed = await getEdition(e.date); if(!ed) continue;
    (ed.stories||[]).filter(x => x.thread === s.thread).forEach(x => past.push({date:e.date, title:x.title, op:st.opinions.find(o=>o.date===e.date && o.id===x.id)}));
  }
  if(openId !== s.id || !past.length) return;
  past.sort((a,b) => a.date.localeCompare(b.date));
  box.hidden = false;
  box.querySelector('.tl').innerHTML = past.map(p => `<div><small>${esc(p.date.replace(/-/g,'.'))}</small>${esc(p.title)}${p.op?`<small>そのときのあなた：${esc(p.op.choice)}</small>`:''}</div>`).join('') + `<div class="now"><small>${esc(D.date.replace(/-/g,'.'))}　きょう</small>${esc(s.title)}</div>`;

let speaking = null;
function speakStory(s){
  try{
    speechSynthesis.cancel();
    if(speaking === s.id){ speaking = null; renderSheet(); return; }
    const answered = !s.quiz || st.quiz[qkey(s)] != null;
    const parts = [s.hook || s.title];
    if(s.quiz && !answered) parts.push('まずはクイズ。' + s.quiz.q + ' ' + s.quiz.choices.map((c,i)=>'ABC'[i]+'、'+c).join('。'));
    else parts.push(...s.points, 'そもそも。' + s.background, s.why ? 'わたしに関係ある？ ' + s.why : '');
    const u = new SpeechSynthesisUtterance(parts.filter(Boolean).join('。 ').replace(/。。/g,'。'));
    u.lang = 'ja-JP'; u.rate = 1.05;
    const v = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)); if(v) u.voice = v;
    u.onend = u.onerror = () => { if(speaking === s.id){ speaking = null; if(openId === s.id) renderSheet(); } };
    speaking = s.id; speechSynthesis.speak(u); renderSheet();
  } catch(e){ speaking = null; }
}
function termKey(t){ return String(t).replace(/[（(].*$/, '').trim(); }
function withTerms(html, s, used){
  (s.terms||[]).forEach(t => { const k = esc(termKey(t.term)); if(k.length < 2 || used.has(k)) return;
    const i = html.indexOf(k); if(i < 0) return;
    const before = html.slice(0, i); if(before.lastIndexOf('<') > before.lastIndexOf('>')) return;
    used.add(k); html = before + `<button class="tw" type="button" data-tw="${esc(t.term)}">${k}</button>` + html.slice(i + k.length); });
  return html;
}

  if(b.dataset.close){ closeSheet(); return; }
  if(b.dataset.sw){ sheetSwipe(b.dataset.sw); return; }
  if(b.dataset.next){ openSheet(b.dataset.next); return; }
  const s = D.stories.find(x => x.id === openId);
  if(b.dataset.speak && s){ speakStory(s); return; }
  if(b.dataset.tell && s){ tellStory(s, b); return; }
  if(b.dataset.quiz && s){ markDay(); st.quiz[qkey(s)] = +b.dataset.quiz; justRight = +b.dataset.quiz === s.quiz.answer ? qkey(s) : null; save(); renderStories(); justRight = null; return; }

    st.opinions.push({date:D.date, id:s.id, title:s.title, thread:s.thread||'', q:s.opinion.q, choice:c, savedAt:today()}); save(); renderStories(); return; }

async function ask(id, preset){
  const s = D.stories.find(x=>x.id===id); const ta = $('#q-'+id); const out = $('#a-'+id);
  const q = (preset || ta.value).trim(); if(!q || !sample) return;
  if(asking) asking.abort(); asking = new AbortController();
  out.hidden = false; out.textContent = '考えています…';
  const ctx = {title:s.title, points:s.points, background:s.background, angles:s.angles, headlines:s.headlines.map(h=>h.outlet+': '+h.title)};
  const prompt = `あなたは世界のニュースをやさしく教える先生です。読者は世界のことをもっと学びたい大人です。\n次のニュースの話題（${D.date}の各媒体の見出しと要約）について、読者の質問に日本語で答えてください。\n・やさしい言葉で、400字くらいまで。\n・この話題の資料にない最近の出来事は断定せず「〜とみられる」などと書く。\n・一般的な背景知識は使ってよい。\n\n話題の資料:\n${JSON.stringify(ctx)}\n\n質問: ${q}`;
  try {
    const r = await sample(prompt, {signal: asking.signal, onText: u => { out.textContent = u.text; }, cache:false});
    out.textContent = r.text;
    st.marks.push({text:'Q: '+q+' → '+r.text.slice(0,180), story:id, storyTitle:s.title, date:D.date, savedAt:today(), qa:true});
    save();
  } catch(e){
    out.textContent = e && e.code === 'rate_limited' ? '少し時間をおいてからもう一度どうぞ。' : (e && e.code === 'not_granted' ? 'この画面ではClaudeに質問できません。' : '答えを取得できませんでした。');
    if(e && e.code === 'not_granted'){ sample = null; }
  }
}

  eds.forEach(ed => (ed.stories||[]).forEach(s => { const f = s.fig; if(!f) return;
    if(f.kind === 'who') (f.nodes||[]).forEach(n => add(n[0], n[1], n[2], ed.date, s.title));
    if(f.kind === 'vs') [f.left, f.right].forEach(n => n && add(n[0], n[1], (n[2]||[])[0], ed.date, s.title)); }));
  if(wtab !== 'zukan' || $('#v-words').hidden) return;
  const list = [...m.values()].sort((a,b) => b.items.length - a.items.length || a.name.localeCompare(b.name, 'ja'));
  $('#wbody').innerHTML = list.length ? `<p class="empty" style="text-align:left">ニュースの図に出てきた人・国・組織が、号をまたいで自動でたまります。何度も出てくる名前ほど上に来ます。</p><div class="zukan">${list.map(z => `<div class="zcard"><span class="e">${esc(z.e)}</span><b>${esc(z.name)}</b><span class="n">${z.items.length}回登場</span>
    <ul>${z.items.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x => `<li>${esc(x.date.slice(5).replace('-','/'))} ${x.note?esc(x.note)+'（':''}${esc(shortText(x.title, 28))}${x.note?'）':''}</li>`).join('')}</ul></div>`).join('')}</div>`
    : '<p class="empty">まだ図に出てきた人物はいません。</p>';
}
function renderWords(){
  const tabs = [['words',`単語 ${st.words.length}`],['zukan','登場人物・国の図鑑'],['marks',`マーカー・質問 ${st.marks.length}`],['bm',`保存した話題 ${st.bookmarks.length}`]];
  $('#wtabs').innerHTML = tabs.map(([k,l]) => `<button class="chip" type="button" data-t="${k}" aria-pressed="${k===wtab}">${l}</button>`).join('');
  let h = '';
  const rev = a => a.map((x,i)=>[x,i]).reverse();
  if(wtab==='words') h = st.words.length ? `<div class="list">${rev(st.words).map(([w,i])=>`<div class="item"><b>${esc(w.term)}</b><span>${esc(w.def)}</span>${w.known?'<span class="known">覚えた</span>':''}<small>${esc(w.date||'')}${w.storyTitle?(w.story?`・<button class="gostory" type="button" data-gs="${esc(w.date)}|${esc(w.story)}">${esc(w.storyTitle)} →</button>`:'・'+esc(w.storyTitle)):''}</small><button class="rm" type="button" data-rm="words" data-i="${i}">削除</button></div>`).join('')}</div>` : `<p class="empty">用語の「単語帳に追加」か、上のフォームで単語をためられます。</p>`;
  if(wtab==='marks') h = st.marks.length ? `<div class="list">${rev(st.marks).map(([m,i])=>`<div class="item"><span>${m.qa?esc(m.text):`<mark>${esc(m.text)}</mark>`}</span><small>${esc(m.date||'')}${m.storyTitle?'・'+esc(m.storyTitle):''}</small><button class="rm" type="button" data-rm="marks" data-i="${i}">削除</button></div>`).join('')}</div>` : `<p class="empty">記事の文章を選んで「マーカーで保存」を押すとここにたまります。Claudeへの質問と答えもここに残ります。</p>`;
  if(wtab==='zukan'){ h = '<p class="empty">読みこみ中…</p>'; buildZukan(); }
  if(wtab==='bm') h = st.bookmarks.length ? `<div class="list">${rev(st.bookmarks).map(([b,i])=>`<div class="item"><a href="#today" data-go="${esc(b.date)}">${esc(b.title)}</a><small>${esc(b.date)}</small><button class="rm" type="button" data-rm="bookmarks" data-i="${i}">削除</button></div>`).join('')}</div>` : `<p class="empty">話題の「☆ 保存」を押すとここにたまります。</p>`;
  $('#wbody').innerHTML = h;
}
$('#wtabs').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; wtab=b.dataset.t; renderWords(); });
$('#wbody').addEventListener('click', e => {
  const b = e.target.closest('button,a'); if(!b) return;
  if(b.dataset.rm){ st[b.dataset.rm].splice(+b.dataset.i,1); save(); renderWords(); }
  if(b.dataset.go){ openEdition(b.dataset.go); }
  if(b.dataset.gs){ const [d, id] = b.dataset.gs.split('|'); goStory(d, id); }
});
async function goStory(d, id){ filter = 'すべて'; placeF = null; await openEdition(d); location.hash = '#today'; setTimeout(() => { if(D.date === d) openSheet(id); }, 80); }
$('#addword').addEventListener('submit', e => {
  e.preventDefault(); const t = $('#aw-term').value.trim(); if(!t) return;
  st.words = st.words.filter(w=>w.term!==t);
  st.words.push({term:t, def:$('#aw-def').value.trim(), date:today(), savedAt:today(), known:false, own:true});
  $('#aw-term').value=''; $('#aw-def').value=''; save(); renderWords();
});

/* ---------- ふりかえり ---------- */
let qi = 0, reveal = false;
function weekAgo(){ const d = new Date(); d.setDate(d.getDate()-7); return d.toLocaleDateString('sv-SE',{timeZone:'Asia/Kuala_Lumpur'}); }
const retry = {};
async function buildMiss(){
  const eds = await allEditions(), miss = [];
  eds.forEach(ed => (ed.stories||[]).forEach(s => { const a = st.quiz[ed.date+'|'+s.id]; if(s.quiz && a != null && a !== s.quiz.answer) miss.push({ed, s, k:ed.date+'|'+s.id}); }));
  if($('#v-review').hidden) return;
  $('#rmiss').innerHTML = miss.length ? miss.map(({ed,s,k}) => { const r = retry[k];
    return `<div class="miss"><small>${esc(ed.date)}・${esc(s.title)}</small><span class="q">${esc(s.quiz.q)}</span>
      <div class="qopts">${s.quiz.choices.map((c,i) => `<button class="qopt${r!=null && i===s.quiz.answer?' right':''}${r===i && i!==s.quiz.answer?' wrong':''}" type="button" data-rk="${esc(k)}" data-ri="${i}" ${r!=null?'disabled':''}>${'ABC'[i]}　${esc(c)}</button>`).join('')}</div>
      ${r!=null ? `<span>${r===s.quiz.answer?'◎ 今度は正解！':'△ 正解は '+'ABC'[s.quiz.answer]}　${esc(s.quiz.explain)}</span>` : ''}</div>`; }).join('')
    : '<p class="empty">はずれた予想はまだありません。「今日のニュース」で予想してみましょう。</p>';
}
$('#rmiss').addEventListener('click', e => { const b = e.target.closest('button'); if(!b || !b.dataset.rk) return; retry[b.dataset.rk] = +b.dataset.ri; markDay(); save(); buildMiss(); });
function renderReview(){
  checkBadges(); $('#rbadges').innerHTML = badgesHTML();
  const w0 = weekAgo();
  const wkWords = st.words.filter(w => (w.savedAt||w.date||'') >= w0);
  const wkBm = st.bookmarks.filter(b => (b.savedAt||b.date||'') >= w0);
  const wkMarks = st.marks.filter(m => (m.savedAt||m.date||'') >= w0);
  const known = st.words.filter(w=>w.known).length;
  $('#rstats').innerHTML = [[wkWords.length,'今週ためた単語'],[wkBm.length,'今週保存した話題'],[wkMarks.length,'今週のマーカー・質問'],[`${known}/${st.words.length}`,'覚えた単語'],[Object.keys(st.quiz).length,'これまで予想した数'],[`🔥${streak().n}`,'連続で予想した日数']]
    .map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  const pool = st.words.filter(w=>!w.known);
  if(!st.words.length){ $('#rcard').innerHTML = `<p class="empty">単語をためると、ここで暗記カードとしてふりかえれます。</p>`; }
  else if(!pool.length){ $('#rcard').innerHTML = `<p class="empty">全部「覚えた」になりました。新しい単語をためていきましょう。</p>`; }
  else {
    const w = pool[qi % pool.length];
    $('#rcard').innerHTML = `<div class="card"><small>まだ覚えていない単語 ${(qi%pool.length)+1}／${pool.length}</small>
      <div class="q">${esc(w.term)}</div>${reveal?`<div class="a">${esc(w.def||'（メモなし）')}</div>${w.storyTitle?`<small>${esc(w.storyTitle)}</small>`:''}`:`<div class="a">意味を思い出してから、めくってみましょう。</div>`}
      <div class="tabs">${reveal?`<button class="chip" type="button" data-q="known">覚えた</button><button class="chip" type="button" data-q="next">まだ</button>`:`<button class="chip" type="button" data-q="flip">めくる</button>`}</div></div>`;
  }
  buildMiss();
  $('#rop').innerHTML = st.opinions.length ? st.opinions.slice().reverse().map(o=>`<div class="item"><b>${esc(o.choice)}</b><span>${esc(o.q)}</span><small>${esc(o.date)}・${esc(o.title)}</small></div>`).join('') : `<p class="empty">話題の最後にある「あなたはどう思う？」を選ぶと、ここに自分の考えがたまっていきます。</p>`;
  $('#rbm').innerHTML = wkBm.length ? wkBm.map(b=>`<div class="item"><a href="#today" data-go="${esc(b.date)}">${esc(b.title)}</a><small>${esc(b.date)}</small></div>`).join('') : `<p class="empty">今週保存した話題はまだありません。</p>`;
}
$('#rcard').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const pool = st.words.filter(w=>!w.known); const w = pool[qi % pool.length];
  if(b.dataset.q==='flip'){ reveal = true; }
  if(b.dataset.q==='next'){ qi++; reveal = false; }
  if(b.dataset.q==='known' && w){ w.known = true; w.knownAt = today(); reveal = false; save(); }
  renderReview();
});
$('#rbm').addEventListener('click', e => { const a=e.target.closest('a'); if(a && a.dataset.go) openEdition(a.dataset.go); });

/* ---------- 過去の号 ---------- */
function renderArchive(){
  $('#arch').innerHTML = editions.map(e => { const n = Object.keys(st.quiz).filter(k => k.startsWith(e.date+'|')).length;
    return `<a href="#today" data-go="${esc(e.date)}"><small>${esc(e.date.replace(/-/g,'.'))}・${e.count}話題</small>${(e.titles||[]).map(t=>`<span>${esc(t)}</span>`).join('')}<span class="myq">${n ? `予想した話 ${n}／${e.count}` : 'まだ予想していません →'}</span></a>`; }).join('');
}
$('#arch').addEventListener('click', e => { const a=e.target.closest('a'); if(a && a.dataset.go) openEdition(a.dataset.go); });


/* ---------- サクッと（スワイプ） ---------- */
let si = 0, sdate = null, kept = 0, stab = 'すべて';
const STABS = ['すべて','日本','マレーシア','世界','経済'];
function swipeList(){
  return D.stories.filter(s => stab==='すべて' || (stab==='経済' ? /経済|ビジネス|市場|金融/.test(s.cat) : s.region===stab));
}
function renderStabs(){
  $('#stabs').innerHTML = STABS.map(t => { const n = t==='すべて' ? D.stories.length : (() => { const k = stab; stab = t; const c = swipeList().length; stab = k; return c; })();
    return `<button class="chip" type="button" data-st="${t}" aria-pressed="${t===stab}">${t} ${n}</button>`; }).join('');
}
function shortText(t, n){ t = String(t||''); return t.length > n ? t.slice(0, n) + '…' : t; }
function cardHTML(s, cls){
  const t = s.terms && s.terms[0];
  const outlets = new Set(s.headlines.map(h => h.outlet)).size;
  return `<div class="scard ${cls}" data-id="${esc(s.id)}"><span class="stamp yes">あとで読む</span><span class="stamp no">とばす</span>
    <div class="meta"><span class="reg" data-r="${esc(s.region)}">${esc(s.region)}</span><span>${esc(s.cat)}</span><span class="count">${outlets}媒体</span></div>
    ${s.emoji?`<span class="emo">${esc(s.emoji)}</span>`:''}<h2>${esc(s.hook||s.title)}</h2>${s.quiz?'':(s.hook?`<p class="lead" style="color:var(--muted);font-size:13.5px">${esc(s.title)}</p>`:`<p class="lead">${esc(shortText(s.points[0], 120))}</p>`)}
    ${s.quiz ? swipeQuiz(s) : (s.fig ? figHTML(s.fig) : '')}
    ${t && !s.fig && !s.quiz ? `<div class="kt">今日の用語　<b>${esc(t.term)}</b>：${esc(shortText(t.def, 60))}</div>` : ''}
    ${sfootHTML(s)}</div>`;
}
function sfootHTML(s){
  const a = s.quiz ? st.quiz[qkey(s)] : 0;
  const why = a != null && s.why ? `<div class="swhy"><b>わたしに関係ある？</b>${esc(shortText(s.why, 64))}</div>` : '';
  return `<div class="sfoot">${why}<div class="sfl">${s.place ? `<span>📍 ${esc(s.place[0])}</span>` : '<span></span>'}<span class="tapmore">タップで詳しく →</span></div></div>`;
}
function swipeQuiz(s){
  const qz = s.quiz, a = st.quiz[qkey(s)];
  return `<div class="quiz">${justRight===qkey(s)?'<span class="burst" aria-hidden="true">🎉</span>':''}<div class="q">🤔 ${esc(qz.q)}</div><div class="qopts">${qz.choices.map((c,i) =>
    `<button class="qopt${a!=null && i===qz.answer?' right':''}${a===i && i!==qz.answer?' wrong':''}" type="button" data-sq="${i}" ${a!=null?'disabled':''}>${'ABC'[i]}　${esc(c)}</button>`).join('')}</div>
    ${a!=null ? `<div class="qres"><b>${a===qz.answer?'◎ 正解！':'△ 正解は '+'ABC'[qz.answer]}</b>　${esc(shortText(qz.explain, 70))}</div>` : ''}</div>`;
}
function renderSwipe(){
  if(sdate !== D.date){ sdate = D.date; si = 0; kept = 0; }
  renderStabs();
  const list = swipeList(), deck = $('#deck');
  $('#sprog').textContent = si < list.length ? `${D.date.replace(/-/g,'.')}　${si+1}／${list.length}　${streakText()}` : '';
  $('#sbtns').hidden = si >= list.length;
  if(si >= list.length){
    deck.innerHTML = `<div class="scard" style="cursor:default;justify-content:center;align-items:center;text-align:center">
      ${(() => { const qs = list.filter(x => x.quiz), dn = qs.filter(x => st.quiz[qkey(x)] != null), ok = dn.filter(x => st.quiz[qkey(x)] === x.quiz.answer);
        return `<span class="emo">${ok.length && ok.length === dn.length ? '🏆' : '☕'}</span><h2>${stab==='すべて'?'今朝の':stab+'の'}${list.length}話題を見終わりました</h2>
        ${qs.length ? `<p class="lead">予想 ${dn.length}問のうち <b>${ok.length}問</b> 的中　${streakText()}</p>` : ''}
        <p class="lead">「あとで読む」にしたのは ${kept} 件です。</p>`; })()}
      <div class="sbtns">${kept ? '<button type="button" class="keep" data-s="read">あとで読むにした話を読む</button>' : '<button type="button" class="keep" data-s="today">今日のニュースをじっくり読む</button>'}<button type="button" data-s="again">もう一度</button></div></div>`;
    return;
  }
  deck.innerHTML = (list[si+1] ? cardHTML(list[si+1], 'back') : '') + cardHTML(list[si], 'front');
  bindDrag(deck.querySelector('.front'));
}
function swipeDone(dir){
  const s = swipeList()[si]; if(!s) return;
  if(dir === 'keep'){ if(!isBm(s.id)){ st.bookmarks.push({id:s.id, title:s.title, date:D.date, savedAt:today()}); save(); } kept++; }
  const card = $('#deck .front');
  if(card){ card.classList.add('anim'); card.style.transform = `translateX(${dir==='keep'?120:-120}%) rotate(${dir==='keep'?18:-18}deg)`; card.style.opacity = '0'; }
  si++; setTimeout(renderSwipe, 230);
}
function openStory(id){ filter = 'すべて'; location.hash = '#today'; setTimeout(() => openSheet(id), 60); }
function bindDrag(card){
  if(!card) return;
  let x0 = null, y0 = 0, dx = 0, moved = false;
  const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
  card.addEventListener('pointerdown', e => { if(e.target.closest('button')) return; x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; card.setPointerCapture(e.pointerId); card.classList.remove('anim'); });
  card.addEventListener('pointermove', e => {
    if(x0 === null) return; dx = e.clientX - x0;
    if(Math.abs(dx) > 6) moved = true;
    card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx/90)); no.style.opacity = Math.max(0, Math.min(1, -dx/90));
  });
  const end = () => {
    if(x0 === null) return; x0 = null;
    if(dx > 90) return swipeDone('keep');
    if(dx < -90) return swipeDone('skip');
    card.classList.add('anim'); card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0;
    if(!moved) openStory(card.dataset.id);
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
}
$('#v-swipe').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.sq){ const s = swipeList()[si]; if(s && s.quiz && st.quiz[qkey(s)] == null){ markDay(); st.quiz[qkey(s)] = +b.dataset.sq; justRight = +b.dataset.sq === s.quiz.answer ? qkey(s) : null; save(); renderSwipe(); justRight = null; } return; }
  if(b.dataset.s === 'keep' || b.dataset.s === 'skip') swipeDone(b.dataset.s);
  if(b.dataset.st){ stab = b.dataset.st; si = 0; kept = 0; renderSwipe(); return; }
  if(b.dataset.s === 'more' && swipeList()[si]) openStory(swipeList()[si].id);
  if(b.dataset.s === 'again'){ si = 0; kept = 0; renderSwipe(); }
  if(b.dataset.s === 'read'){ filter = '★'; location.hash = '#today'; }
  if(b.dataset.s === 'today'){ filter = 'すべて'; location.hash = '#today'; }
});
addEventListener('keydown', e => {
  if($('#v-swipe').hidden || e.target.closest('input,textarea,select')) return;
  if(e.key === 'ArrowRight') swipeDone('keep');
  if(e.key === 'ArrowLeft') swipeDone('skip');
});

/* ---------- 画面切り替え ---------- */
const VIEWS = ['swipe','today','words','review','archive','kiso'];
function route(){
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'swipe';
  VIEWS.forEach(x => { const el = $('#v-'+x); if(el) el.hidden = x !== v; });
  document.querySelectorAll('.appnav a').forEach(a => a.setAttribute('aria-current', a.dataset.v===v ? 'page' : 'false'));
  if(v==='words') renderWords(); if(v==='review') renderReview(); if(v==='archive') renderArchive();
  if(v==='today'){ renderFilters(); renderStories(); }
  if(v==='swipe') renderSwipe();
  if(v==='kiso' && window.renderKiso) window.renderKiso();
  if(v!=='today' && openId) closeSheet();
}
addEventListener('hashchange', () => { route(); scrollTo(0,0); });
renderEdition(); route(); checkBadges(); badgeReady = true;
setSync('この端末に保存しています');

/* ---------- サイト版：号の一覧をファイルから読む ---------- */
if(window.NEWSBOOK_SITE){
  fetch('editions/index.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).then(j => {
    const list = (j && j.editions || []).slice().sort((a,b)=> b.date.localeCompare(a.date));
    if(!list.length) return;
    editions = list; renderEditionSelect(); if(!$('#v-archive').hidden) renderArchive();
    if(list[0].date !== D.date) openEdition(list[0].date);
  }).catch(() => {});
}

/* ---------- サーバー連携（使えるときだけ） ---------- */
(async () => {
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [dbNs, userNs, sampleNs] = await Promise.all([use('db'), use('user'), use('sample')]);
  if(sampleNs){ sample = sampleNs; renderStories(); }
  if(!dbNs) return;
  db = dbNs;
  db.doc('meta/index').onSnapshot(snap => {
    if(!snap.exists) return;
    const list = (snap.data().editions || []).slice().sort((a,b)=> b.date.localeCompare(a.date));
    if(!list.length) return;
    const wasLatest = D.date === editions[0].date;
    editions = list; renderEditionSelect(); if(!$('#v-archive').hidden) renderArchive();
    if(wasLatest && list[0].date !== D.date) openEdition(list[0].date);
  }, () => {});
  const uid = userNs ? await userNs.id() : null;
  if(!uid){ setSync('サインインすると、どの端末でも同期されます'); return; }
  stateRef = db.doc('data/users/' + uid + '/state');
  const timer = setTimeout(() => setSync('同期先につながりません。この端末には保存しています'), 10000);
  stateRef.onSnapshot(snap => {
    if(snap.metadata.hasPendingWrites) return;
    clearTimeout(timer);
    if(!remoteReady){
      remoteReady = true;
      if(!snap.exists){ save(); setSync('どの端末でも同期されます'); return; }
    }
    if(snap.exists){
      const d = snap.data();
      st = {bookmarks: d.bookmarks || [], words: d.words || [], marks: d.marks || [], quiz: d.quiz || {}, opinions: d.opinions || [], follows: d.follows || [], quizDays: d.quizDays || {}};
      try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {}
      setSync('どの端末でも同期されます');
      route();
    }
  }, () => { clearTimeout(timer); setSync('同期できません。この端末には保存しています'); });
})();
</script>

<script>
(function(){
  const K = JSON.parse(document.getElementById('kiso-data').textContent);

  const nav = document.getElementById('nav-kiso'); if(nav) nav.hidden = false;
  const e = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const RKEY = 'newsbook-kiso-v1';
  let ks = {}; try { ks = JSON.parse(localStorage.getItem(RKEY) || '{}') || {}; } catch(_) {}
  ks.read = ks.read || {}; ks.quiz = ks.quiz || {};
  const keep = () => { try { localStorage.setItem(RKEY, JSON.stringify(ks)); } catch(_) {} };
  let cur = null;

  /* 話題 → 関連講座 */
  function related(s, n){
    if(!s) return [];
    const ti = s.title || '', body = [].concat(s.points || []).join(' ') + ' ' + (s.background || '');
    const out = [];
    for(const p of P){
      if(p.regions && !p.regions.includes(s.region)) continue;
      const re = new RegExp(p.match, p.flags === '' ? 'g' : 'gi');
      const cnt = t => new Set((t.match(re) || [])).size;
      const sc = cnt(ti) * 3 + cnt(body);
      if(sc >= 3) out.push([sc, p]);
    }
    return out.sort((a, b) => b[0] - a[0]).slice(0, n || 3).map(x => x[1]);
  }
  window.kisoRelated = related;
  window.kisoLinks = function(s){
    const r = related(s, 3); if(!r.length) return '';
    return `<div class="sec kiso-links swipe-no"><h3>📘 そもそも講座でわかる</h3><p>この話の「前提」を3分でおさらい</p><div class="kchips">${r.map(p => `<a class="kchip" href="#kiso-${e(p.id)}">${e(p.emoji)} ${e(p.title)}</a>`).join('')}</div></div>`;
  };
  function todayStories(){ try { return (typeof D !== 'undefined' && D && D.stories) ? D.stories : []; } catch(_) { return []; } }
  function storiesFor(p){ return todayStories().filter(s => related(s, 3).includes(p)); }

  /* 図のかたち */
  function blk(b){
    const h = b.title ? `<h4>${e(b.title)}</h4>` : '';

    if(b.type === 'vs') return `<div class="kblk">${h}<div class="kvs">${[b.left, b.right].map(x => `<div><b>${e(x[0])}</b><ul>${x[1].map(t => `<li>${e(t)}</li>`).join('')}</ul></div>`).join('')}</div>${note}</div>`;
    if(b.type === 'timeline') return `<div class="kblk">${h}<ol class="ktl">${b.items.map(x => `<li><b>${e(x[0])}</b>${e(x[1])}</li>`).join('')}</ol>${note}</div>`;
    if(b.type === 'cast') return `<div class="kblk">${h}<div class="kcast">${b.items.map(x => `<div><span>${e(x[0])}</span><b>${e(x[1])}</b><small>${e(x[2])}</small></div>`).join('')}</div>${note}</div>`;
    if(b.type === 'points') return `<div class="kblk">${h}<ul class="kpts">${b.items.map(t => `<li>${e(t)}</li>`).join('')}</ul>${note}</div>`;
    if(b.type === 'bars'){
      const vals = b.items.map(x => x[1]), mx = Math.max(0, ...vals), mn = Math.min(0, ...vals), span = (mx - mn) || 1;
      const z = (-mn / span) * 100;
      const rows = b.items.map(([l, v]) => {
        const w = Math.abs(v) / span * 100, left = v >= 0 ? z : z - w;
        return `<div class="kbar"><span>${e(l)}</span><div>${mn < 0 ? `<b class="zero" style="left:${z}%"></b>` : ''}<i class="${v < 0 ? 'neg' : ''}" style="left:${left}%;width:${w}%"></i></div><em class="${v < 0 ? 'neg' : ''}">${v > 0 && mn < 0 ? '+' : ''}${v}${e(b.unit || '')}</em></div>`;
      }).join('');
      return `<div class="kblk">${h}<div class="kbars">${rows}</div>${note}</div>`;
    }
    if(b.type === 'cycle'){
      const n = b.steps.length, R = 38, pt = i => { const a = -Math.PI/2 + i * 2*Math.PI/n; return [50 + R*Math.cos(a), 50 + R*Math.sin(a)]; };
      const arcs = b.steps.map((_, i) => {
        const a0 = -Math.PI/2 + (i + .32) * 2*Math.PI/n, a1 = -Math.PI/2 + (i + .68) * 2*Math.PI/n;
        const p0 = [50 + R*Math.cos(a0), 50 + R*Math.sin(a0)], p1 = [50 + R*Math.cos(a1), 50 + R*Math.sin(a1)];
        const t = [-Math.sin(a1), Math.cos(a1)], nx = [Math.cos(a1), Math.sin(a1)];
        const tip = [p1[0] + t[0]*2.2, p1[1] + t[1]*2.2], b1 = [p1[0] + nx[0]*1.6, p1[1] + nx[1]*1.6], b2 = [p1[0] - nx[0]*1.6, p1[1] - nx[1]*1.6];
        const f = q => q.map(v => v.toFixed(2)).join(',');
        return `<path d="M${f(p0)} A${R},${R} 0 0 1 ${f(p1)}"/><polygon points="${f(tip)} ${f(b1)} ${f(b2)}"/>`;
      }).join('');
      return `<div class="kblk">${h}<div class="kcycle"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${R}"/>${arcs}</svg><p>🔁<br>くり返す</p>${b.steps.map((t, i) => { const [x, y] = pt(i); return `<div style="left:${x}%;top:${y}%">${e(t)}</div>`; }).join('')}</div>${note}</div>`;
    }
    return '';
  }

  function hasW(t){ try { return st.words.some(w => w.term === t); } catch(_) { return false; } }
  function list(){
    const done = P.filter(p => ks.read[p.id]).length;
    const cnt = {}; todayStories().forEach(s => related(s, 2).forEach((p, j) => { cnt[p.id] = (cnt[p.id] || 0) + (j ? 1 : 2); }));
    const todayP = P.filter(p => cnt[p.id]).sort((a, b) => cnt[b.id] - cnt[a.id]).slice(0, 5);
    const todayIds = new Set(todayP.map(p => p.id));
    sec.className = 'view';
    sec.innerHTML = `<h2>そもそも講座</h2>
      <p class="kiso-lede">ニュースが「ふーん」で終わらないための、世界の“前提知識”。1つ3分、図で読めます。</p>
      <div class="kiso-prog"><b>${P.length}講座のうち ${done} 講座を読みました${done === P.length ? ' 🎉' : ''}</b><div class="kiso-bar"><i style="width:${done / P.length * 100}%"></i></div></div>
      ${todayP.length ? `<div class="kiso-grp"><h3>📌 今日のニュースを読むなら <small>まずはこの5つから</small></h3><div class="kchips">${todayP.map(p => `<button type="button" class="kchip k-${e(p.group)}" data-kiso="${e(p.id)}">${e(p.emoji)} ${e(p.title)}${ks.read[p.id] ? ' ✓' : ''}</button>`).join('')}</div></div>` : ''}
      ${K.groups.map(g => `<div class="kiso-grp k-${e(g.id)}"><h3>${e(g.emoji)} ${e(g.title)} <small>${e(g.sub)}</small></h3><div class="kiso-cards">${P.filter(p => p.group === g.id).map(p => `<button type="button" class="kcard" data-kiso="${e(p.id)}">${todayIds.has(p.id) ? '<em class="ktoday">今日のニュースに登場</em>' : ''}${ks.read[p.id] ? '<em class="kdone">✓ 読んだ</em>' : ''}<span class="ke">${e(p.emoji)}</span><b>${e(p.title)}</b><span>${e(p.sub)}</span></button>`).join('')}</div></div>`).join('')}`;
  }
  function detail(p){
    const order = K.groups.flatMap(g => P.filter(x => x.group === g.id));
    const i = order.indexOf(p), nx = order[i + 1];
    const q = p.quiz, qa = ks.quiz[p.id];
    const ss = storiesFor(p);
    sec.className = 'view k-' + p.group;
    sec.innerHTML = `<div class="kd">
      <button type="button" class="kback" data-kiso="">← 講座の一覧</button>
      <div class="khead"><span class="ke">${e(p.emoji)}</span><h2>${e(p.title)}</h2><p>${e(p.sub)}</p></div>
      <div class="kone"><b>ひとことで言うと</b>${e(p.one)}</div>
      <p class="kwhy"><b>なぜニュースによく出る？</b> ${e(p.why)}</p>
      ${p.blocks.map(blk).join('')}
      <div class="kblk"><h4>📰 ニュースではこう言います</h4><div class="ktalk">${p.talk.map(([a, b]) => `<div><b>${e(a)}</b><span>${e(b)}</span></div>`).join('')}</div></div>
      <div class="kblk"><h4>🧠 1問チェック</h4><div class="kquiz"><p>${e(q.q)}</p><div class="kc">${q.c.map((c, j) => `<button type="button" data-kq="${j}" class="${qa != null ? (j === q.a ? 'ok' : (j === qa ? 'ng' : '')) : ''}">${e(c)}</button>`).join('')}</div>${qa != null ? `<p class="kans">${qa === q.a ? '⭕ 正解！' : '❌ おしい！ 正解は「' + e(q.c[q.a]) + '」'}　${e(q.why)}</p>` : ''}</div></div>
      <div class="kblk"><h4>📒 おぼえておきたい言葉</h4><div class="kterms">${p.terms.map(([t, d]) => `<div><p><b>${e(t)}</b>${e(d)}</p>${typeof st !== 'undefined' ? `<button type="button" data-kw="${e(t)}" data-kd="${e(d)}" class="${hasW(t) ? 'on' : ''}">${hasW(t) ? '単語帳に追加済み' : '単語帳に追加'}</button>` : ''}</div>`).join('')}</div></div>
      ${ss.length ? `<div class="kblk"><h4>🗞 今日のニュースでは</h4><div class="kstories">${ss.map(s => `<a href="#today" data-ks="${e(s.id)}">${e(s.emoji || '')} ${e(s.title)}</a>`).join('')}</div></div>` : ''}
      <div class="kblk"><h4>🔗 あわせて読みたい</h4><div class="kchips">${p.related.map(id => byId[id]).filter(Boolean).map(r => `<button type="button" class="kchip k-${e(r.group)}" data-kiso="${e(r.id)}">${e(r.emoji)} ${e(r.title)}${ks.read[r.id] ? ' ✓' : ''}</button>`).join('')}</div></div>
      <div class="kfoot"><button type="button" class="kread ${ks.read[p.id] ? 'on' : ''}" data-kr="1">${ks.read[p.id] ? '✓ 読みました' : '読んだ！'}</button>${nx ? `<button type="button" class="kchip k-${e(nx.group)}" data-kiso="${e(nx.id)}">次の講座：${e(nx.emoji)} ${e(nx.title)} →</button>` : ''}</div>
    </div>`;
  }
  window.renderKiso = function(){ const p = cur && byId[cur]; if(p) detail(p); else list(); };
  function open(id){ cur = id || null; window.renderKiso(); scrollTo(0, 0); }

  sec.addEventListener('click', ev => {
    const t = ev.target.closest('button,a'); if(!t) return;
    if(t.dataset.kiso != null){ open(t.dataset.kiso); return; }
    const p = byId[cur]; if(!p) return;
    if(t.dataset.kq != null){ ks.quiz[p.id] = +t.dataset.kq; ks.read[p.id] = ks.read[p.id] || new Date().toISOString().slice(0, 10); keep(); detail(p); return; }
    if(t.dataset.kr){ if(ks.read[p.id]) delete ks.read[p.id]; else ks.read[p.id] = new Date().toISOString().slice(0, 10); keep(); detail(p); return; }
    if(t.dataset.kw != null){
      try {
        const term = t.dataset.kw;
        if(hasW(term)) st.words = st.words.filter(w => w.term !== term);
        else st.words.push({term, def: t.dataset.kd, date: (typeof D !== 'undefined' && D.date) || '', savedAt: (typeof today === 'function' ? today() : new Date().toISOString().slice(0, 10)), storyTitle: 'そもそも講座「' + p.title + '」', known: false, own: true});
        save();
      } catch(_) {}
      detail(p); return;
    }
    if(t.dataset.ks){ ev.preventDefault(); const id = t.dataset.ks; if(typeof openStory === 'function') openStory(id); else location.hash = '#today'; }
  });

  /* #kiso-ID でその講座を直接ひらく（話題の中のリンクから） */
  function deep(){
    const m = location.hash.match(/^#kiso-([\w-]+)$/);
    if(!m) return false;
    cur = byId[m[1]] ? m[1] : null;
    history.replaceState(null, '', '#kiso');
    if(typeof route === 'function') route(); else window.renderKiso();
    scrollTo(0, 0);
    return true;
  }
  addEventListener('hashchange', deep);
  if(nav) nav.addEventListener('click', () => { cur = null; if(location.hash === '#kiso') window.renderKiso(); });
  if(!deep() && location.hash === '#kiso' && typeof route === 'function') route();
})();
</script>

</body></html>
