ak Tribune・The Edgeは、辞任の事実と理由を中心に伝えています。", "Malay Mailは、ハンナ・ヨー氏の「自分が辞めるべきだった」という心情に焦点をあてています。", "Free Malaysia Todayは、ローク氏とBN（ザヒド氏）の言い合いという与党内の対立に注目しています。", "Bernama（国営）・Utusan・Astro Awaniは、「議会解散は首相の権限」という発言を見出しにしています。"], "terms": [{"term": "DAP", "def": "民主行動党。華人系の支持が厚く、汚職追及を掲げてきた政党。アンワル政権の一員。"}, {"term": "BN（国民戦線）", "def": "UMNOを中心とする政党連合。長く政権を担い、今はアンワル政権に参加している。"}, {"term": "議会解散", "def": "下院議員の任期途中で議会を解き、総選挙を行うこと。マレーシアでは首相の助言で国王が行う。"}], "headlines": [{"outlet": "Free Malaysia Today", "region": "マレーシア", "lean": "独立系", "link": "https://www.freemalaysiatoday.com/category/bahasa/tempatan/2026/11/10/loke-cabar-bn-keluar-kerajaan-dakwa-takut-hilang-pengaruh", "title": "Loke cabar BN keluar kerajaan, dakwa takut hilang pengaruh"}, {"outlet": "Bernama", "region": "マレーシア", "lean": "国営通信社", "link": "http://www.bernama.com/en/news.php?id=2632568", "title": "Politics : PM Should Not Bow To Pressure To Dissolve Parliament - Loke"}, {"outlet": "Malay Mail", "region": "マレーシア", "lean": "大手", "link": "https://www.malaymail.com/news/malaysia/2026/11/10/i-should-have-stepped-down-today-hannah-yeoh-says-anthony-loke-paid-the-price-instead/242752", "title": "‘I should have stepped down today’: Hannah Yeoh says Anthony Loke paid the price instead"}, {"outlet": "The Vibes", "region": "マレーシア", "lean": "ネット媒体", "link": "https://www.thevibes.com/articles/news/129386/anthony-loke-resigns-as-transport-minister", "title": "Anthony Loke resigns as Transport Minister"}, {"outlet": "Utusan Malaysia", "region": "マレーシア", "lean": "マレー語・UMNO系", "link": "https://www.utusan.com.my/nasional/2026/11/pm-tak-perlu-tunduk-tekanan-bubar-parlimen/?utm_source=rss&utm_medium=rss&utm_campaign=pm-tak-perlu-tunduk-tekanan-bubar-parlimen", "title": "PM tak perlu tunduk tekanan bubar Parlimen"}, {"outlet": "Astro Awani", "region": "マレーシア", "lean": "民放", "link": "https://www.astroawani.com/berita-politik/bubar-parlimen-kuasa-di-tangan-anwar-bukan-tpm-anthony-loke", "title": "Bubar Parlimen: Kuasa di tangan Anwar, , "title": "Luah pendirian mengenai isu Najib di peti undi, Loke gesa pengundi Melaka"}, {"outlet": "Free Malaysia Today", "region": "マレーシア", "lean": "独立系", "link": "https://www.freemalaysiatoday.com/category/nation/2026/11/10/use-melaka-polls-to-express-views-on-najib-loke-urges-voters", "title": "Use Melaka polls to express views on Najib, Loke urges voters"}, {"outlet": "The Vibes", "region": "マレーシア", "lean": "ネット媒体", "link": "https://www.thevibes.com/articles/news/129390/all-31-melaka-early-voting-centres-close-94.96pc-turnout-recorded", "title": "All 31 Melaka early voting centres close, 94.96pc turnout recorded"}, {"outlet": "Utusan Malaysia", "region": "マレーシア", "lean": "マレー語・UMNO系", "link": "https://www.utusan.com.my/nasional/2026/11/prn-melaka-94-96-peratus-pengundi-awal-tunai-tanggungjawab/?utm_source=rss&utm_medium=rss&utm_campaign=prn-melaka-94-96-peratus-pengundi-awal-tunai-tanggungjawab", "title": "PRN Melaka: 94.96 peratus pengundi awal tunai tanggungjawab"}, {"outlet": "Astro Awani", "region": "マレーシア", "lean": "民放", "link": "https://www.astroawani.com/berita-politik/parti-bersama-wajar-dibubar-selepas-prn-melaka-manifesto-tidak-realistik-penganalisis", "title": "Parti Bersama wajar dibubar selepas PRN Melaka, manifesto tidak realistik - Penganalisis"}, {"outlet": "Astro Awani", "region": "マレーシア", "lean": "民放", "link": "https://www.astroawani.com/berita-malaysia/prn-melaka-9496-peratus-pengundi-awal-tunai-tanggungjawab-spr", "title": "PRN Melaka: 94.96 peratus pengundi awal tunai tanggungjawab - SPR"}, {"outlet": "Kosmo!", "region": "マレーシア", "lean": "マレー語・大衆", "link": "https://www.kosmo.com.my/2026/11/10/94-96-peratus-pengundi-awal-tunai-tanggungjawab-hari-ini/?utm_source=rss&utm_medium=rss&utm_campaign=94-96-peratus-pengundi-awal-tunai-tanggungjawab-hari-ini", "title": "94.96 peratus pengundi awal tunai tanggungjawab hari ini"}]}, {"id": "sarawak", "cat": "経済", "region": "マレーシア", "title": "サラワク州、ソフトバンク主導のAI投資10億ドルを獲得", "points": ["マレーシア・ボルネオ島のサラワク州は、ソフトバンクが主導する総額18.5億ドルのマレーシア向け案件のうち、約10億ドル（約40億リンギ）をAIインフラ開発として受け入れると発表しました。", "アバン・ジョハリ州首相は、ソフトバンク側が2000人以上のエンジニアを必要としているとして、地元の人材育成を急ぐよう呼びかけ、2030年に州のGDP 2820億リンギを達成できると自信を示しました。"], "background": "サラワク州は石油・天然ガスや水力発電が豊富で、電力をたくさん使うデータセンターやAI産業を呼び込もうとしています。一方、Taipei Timesは台湾がマレーシアとの投資協議を中断したと伝えており、マレーシアをめぐる海外投資の動きは一様ではありません。", "angles": ["Dayak Daily・Sarawak Tribune（サラワクの地元紙）は、州首相の発言をていねいに伝え、州の発展計画として前向きに報じています。", "Taipei Times（台湾）は、台湾とマレーシアの投資協議の中断を報じています。"], "terms": [{"term": "AIインフラ", "def": "AIを動かすための土台。データセンター、電力、通信網、半導体など。"}, {"term": "GDP（域内総生産）", "def": "一定期間に、ある地域で新しく生み出されたモノやサービスの価値の合計。経済の大きさを表す。"}], "headlines": [{"outlet": "Taipei Times", "region": "台湾", "lean": "英字紙", "link": "https://www.taipeitimes.com/News/front/archives/2026/11/11/2003867521", "title": "Taiwan suspends investment talks with Malaysia"}, {"outlet": "Dayak Daily", "region": "マレーシア", "lean": "サラワク", "link": "https://dayakdaily.com/premier-seeks-chinese-communitys-mandate-in-kuching-sibu-miri-to-address-key-issues/", "title": "Premier seeks Chinese community’s mandate in Kuching, Sibu, Miri to address key issues"}, {"outlet": "Sarawak Tribune", "region": "マレーシア", "lean": "サラワク", "link": "https://www.sarawaktribune.com/abang-jo-calls-for-early-preparation-for-high-skilled-jobs/", "title": "Abang Jo calls for early preparation for high-skilled jobs"}]}, {"id": "tax", "cat": "政治", "region": "日本", "title": "消費税減税法案、石破氏ら4人が採決を棄権　参院で否決の可能性も", "points": ["衆議院を通過した消費税減税法案の採決で、自民党の石破茂前首相ら4人が退席して棄権し、党は11月9日に4人を「戒告処分」にしました。", "与党は参議院で過半数を持たないため、参院で否決される可能性が取りざたされ、「消費税解散」説まで出ています。一方、小泉防衛相は来年秋の総裁選に高市首相が出れば「全力で支える」と述べました。"], "background": "消費税は買い物のたびにかかる税で、今は10%（食料品などは8%）です。社会保障の大事な財源なので、減税すると暮らしは楽になる一方、その分のお金をどうするかという問題が残ります。与党が少数の国会では、党内から反対が出るだけで法案が通らなくなることがあります。", "angles": ["J-CASTは、元自民党事務局長の「退席した4人のほうが正論に聞こえる」という声を紹介しています。", "東洋経済は、参院否決から解散へ進むシナリオがどれだけ現実的かを分析しています。", "NHK・産経・FNNは、小泉防衛相の高市首相支持の発言を伝えています。"], "terms": [{"term": "戒告処分", "def": "政党が所属議員に出す処分の一つ。一番軽い部類で、注意・警告にあたる。"}, {"term": "少数与党", "def": "政権を担う党（与党）が議会の過半数を持っていない状態。野党の協力がないと法案が通りにくい。"}, {"term": "解散", "def": "首相が衆議院議員を任期の途中で全員失職させ、総選挙を行うこと。"}], "headlines": [{"outlet": "NHK", "region": "日本", "lean": "公共放送", "link": "https://news.web.nhk/newsweb/na/nd-20261110de73825", "title": "小泉防衛相 来年の自民総裁選“高市首相が立候補なら支える”"}, {"outlet": "産経新聞", "region": "日本", "lean": "保守寄り", "link": "null/article/20261110-DFLK2SI2FVL7BJUHJS6ZGFCIHQ/", "title": "小泉防衛相、総裁選に高市首相が出馬すれば「私は全力で支える。国民は高市自民を選んだ」"}, {"outlet": "東洋経済", "region": "日本", "lean": "経済", "link": "https://toyokeizai.net/articles/-/964244?utm_source=rss&utm_medium=http&utm_campaign=link_back", "title": "参院で否決なら｢消費税解散｣も？ 石破氏ら\"4人造反\"で一気に高まった消費税減税法案｢参院否決｣シナリオの現実味"}, {"outlet": "J-CAST", "region": "日本", "lean": "ネット媒体", "link": "https://www.j-cast.com/2026/11/10519083.html", "title": "消費税減税法案採決で「戒告処分」受けた棄権4人 元自民党事務局長はどう見た？「こっちのほうが正論でしょ」"}, {"outlet": "FNNプライムオンライン", "region": "日本", "lean": "民放（フジ系）", "link": "https://www.fnn.jp/articles/-/1149980", "title": "小泉防衛相 来年の自民総裁選に高市総理立候補なら「私は全力で支える」"}]}, {"id": "softbank", "cat": "経済", "region": "日本", "title": "ソフトバンクG、7〜9月期に約7700億円の赤字　マスク氏の「債務不履行」投稿は否定", "points": ["ソフトバンクグループの7〜9月期決算は約7680億円の赤字でした。アナリストは黒字を予想していましたが、米国のデータセンター事業の費用がふくらみました。", "イーロン・マスク氏がXで「債務不履行」と書いたことについて、CFOは「全くの事実無根」と否定しました。米中間選挙で民主党が勝ったことでデータセンター事業が遅れる可能性も「シナリオの一つ」としています。"], "background": "ソフトバンクグループは孫正義氏が率いる投資会社で、AI分野、とくに米国の巨大データセンター計画に大きくお金をつぎ込んでいます。AI関連株が下がると、持っている株の価値も下がり、決算に大きく響きます。", "angles": ["ITmediaは、マスク氏の投稿への反論と、米政治の影響というリスクに焦点をあてています。", "Japan Times（英語）は「予想は黒字だったのに大赤字」と、市場予想とのズレを強調しています。", "FNNは売上高と赤字額の数字をシンプルに伝えています。"], "terms": [{"term": "債務不履行（デフォルト）", "def": "借りたお金を約束どおりに返せなくなること。"}, {"term": "決算", "def": "会社が一定期間にどれだけもうけたか・損したかをまとめて発表すること。"}, {"term": "CFO", "def": "最高財務責任者。会社のお金の管理を担当する役員。"}], "headlines": [{"outlet": "ITmedia", "region": "日本", "lean": "テック", "link": "https://www.itmedia.co.jp/news/article/2611/10/2000003079/", "title": "ソフトバンクG、マスク氏の「債務不履行」投稿に「全くの事実無根」 7～9月期決算は1兆円超の赤字"}, {"outlet": "Japan Times", "region": "日本", "lean": "英字紙", "link": "https://www.japantimes.co.jp/business/2026/11/10/softbank-loss-data-center-costs/", "title": "SoftBank logs $7 billion loss after U.S. data center costs swell"}, {"outlet": "FNNプライムオンライン", "region": "日本", "lean": "民放（フジ系）", "link": "https://www.fnn.jp/articles/-/1149973", "title": "ソフトバンクグループで7680億円赤字 売上高は4兆2350億円に"}]}, {"id": "leak", "cat": "社会・テック", "region": "日本", "title": "スキマバイト「シェアフル」で最大750万件の情報流出か　企業への不正アクセス相次ぐ", "points": ["スキマバイトアプリ「シェアフル」は、社内システムへの不正アクセスで、最大約750万件の個人情報が流出した可能性があると発表しました。給与振込用の口座情報も含まれるとされます。", "9月末から企業を狙った不正アクセスが相次ぎ、無印良品のカード情報、タイ航空やJAL・ANAの乗客情報などでも流出が疑われています。ソフトバンクの社長はサイバー攻撃が急増し「人の手では対応しきれない」と語りました。"], "background": "流出した個人情報は、その人だけに向けた本物らしい詐欺メール（フィッシング）に悪用される心配があります。AIによってシステムの弱点が見つかるスピードも上がっており、守る側の負担が大きくなっています。", "angles": ["ITmediaは技術的な中身と、詐欺メールが今後どう変わるかを掘り下げています。", "J-CASTは、無印良品の発表のタイミングへのSNSの反応を取り上げています。", "TBSは、航空会社の被害が日本だけでなくタイ航空にも広がっていることを伝えています。"], "terms": [{"term": "不正アクセス", "def": "許可なく他人のコンピューターやシステムに入り込むこと。"}, {"term": "フィッシング", "def": "本物の会社などを装ったメールやサイトで、パスワードやカード番号をだまし取る詐欺。"}, {"term": "脆弱性", "def": "ソフトやシステムにある、攻撃に使われうる弱点・欠陥。"}], "headlines": [{"outlet": "ITmedia", "region": "日本", "lean": "テック", "link": "https://www.itmedia.co.jp/news/article/2611/10/2000003072/", "title": "スキマバイト「シェアフル」に不正アクセス 最大750万アカウント漏えいか 給与振込用の口座情報なども"}, {"outlet": "J-CAST", "region": "日本", "lean": "ネット媒体", "link": "https://www.j-cast.com/2026/11/10519075.html", "title": "「無印良品週間」終了翌日に「カード番号全桁」漏えい可能性公表 なぜこのタイミング？SNS波紋、運営会社の見解は"}, {"outlet": "TBS NEWS DIG", "region": "日本", "lean": "民放（TBS系）", "link": "https://newsdig.tbs.co.jp/articles/-/3076253", "title": "タイ航空で乗客の個人情報流出の疑い 旅客サービスシステムの委託先に不正アクセス JALとANAも同様の被害"}]}, {"id": "typhoon", "cat": "災害・天気", "region": "日本", "title": "非常に強い台風32号、小笠原諸島に最接近", "points": ["非常に強い台風32号が小笠原諸島に最も近づいています。気象庁は11日にかけて暴風や高波に警戒するよう呼びかけています。"], "background": "小笠原諸島は東京都に属し、本州から約1000km南の太平洋にあります。11月に台風が32号まで発生するのは多いほうで、海水温の高さとの関係もよく話題になります。", "angles": ["NHKが気象庁の呼びかけを中心に伝えています。"], "terms": [{"term": "非常に強い台風", "def": "最大風速が秒速44m以上54m未満の台風。気象庁の強さの区分の一つ。"}], "headlines": [{"outlet": "NHK", "region": "日本", "lean": "公共放送", "link": "https://news.web.nhk/newsweb/na/nd-20261110de73756", "title": "台風32号 小笠原最接近 暴風高波に警戒を"}]}, {"id": "ukraine", "cat": "政治・外交", "region": "世界", "title": "アブダビでウクライナ和平協議　米・ロ・ウの3者が9カ月ぶりに", "points": ["ロシア・ウクライナ・米国の3者による和平協議が、アラブ首長国連邦のアブダビで約9カ月ぶりに始まり、初日を終えました。ウクライナ側は「人道問題や緊張緩和」を話し合ったとしています。", "米国は「ヨーロッパ全体の安全保障」まで含めた広い合意を呼びかけており、これはロシアの主張に近いとしてヨーロッパの関係者が警戒しています。"], "background": "ロシアは2022年2月にウクライナへ全面侵攻しました。ロシアはNATO（北大西洋条約機構）が東へ広がることに反対しており、ヨーロッパの安全保障の枠組みを見直すことを求めてきました。ウクライナは領土を譲らないことと、将来の安全の保証を求めています。", "angles": ["Washington Post（米）は「交渉前から米国がロシアに得点を与えた」と批判的に見ています。", "Kyiv Independent（ウクライナ）は、自国代表団の説明を中心に伝えています。", "TASS（ロシア国営）は、ロシア代表団の記者会見の予定を伝えています。", "Global Times（中国）とDWは、協議の再開そのものと争点を整理しています。"], "terms": [{"term": "和平協議", "def": "戦争をやめるための話し合い。まず停戦、その後に領土や安全の保証などを決めるのが一般的。"}, {"term": "NATO", "def": "北大西洋条約機構。米国とヨーロッパ諸国の軍事同盟で、1か国が攻撃されたら全体で守る約束がある。"}, {"term": "緊張緩和（ディエスカレーション）", "def": "戦闘や対立が激しくならないように、少しずつ抑えていくこと。"}], "headlines": [{"outlet": "Washington Post", "region": "米国", "lean": "リベラル寄り", "link": "https://www.washingtonpost.com/world/2026/11/10/russia-ukraine-begin-us-backed-peace-talks-abu-dhabi/", "title": "Russia and Ukraine begin U.S.-backed peace talks in Abu Dhabi"}, {"outlet": "DW", "region": "ドイツ", "lean": "公共放送", "link": "https://www.dw.com/en/new-trilateral-talks-on-ukraine-war-in-abu-dhabi-what-to-expect/a-79905734?maca=en-rss-en-world-4025-rdf", "title": "New trilateral talks on Ukraine war in Abu Dhabi: What to expect?"}, {"outlet": "TASS", "region": "ロシア", "lean": "ロシア国営通信", "link": "https://tass.com/politics/2215693", "title": "Russian delegation to Abu Dhabi talks to hold press conference on November 11 — source"}, {"outlet": "Global Times", "region": "中国", "lean": "中国共産党系", "link": "https://www.globaltimes.cn/page/202611/1374050.shtml", "title": "Russia, US and Ukraine resume trilateral talks in Abu Dhabi after nine-month での大敗を受けて党内の指導部選挙を一時見送りました。"], "background": "弾劾は、大統領や長官などの高官を議会が裁く仕組みです。下院が過半数で訴追し、上院が3分の2の賛成で罷免します。先週の中間選挙で民主党が大きく勝ったことで、共和党の中でもトランプ政権との距離をはかる動きが出ています。", "angles": ["The Hill（中道）は議員一人一人の賛否や議会の動きを細かく追っています。", "National Reviewは保守系ですが「一部が可決される可能性はかなりある」と見ています。", "Breitbart（保守強硬）はヘグセス氏の「政治的な見せ物」という反論を中心に伝えています。", "産経はヘグセス氏の会見を日本語で伝えています。"], "terms": [{"term": "弾劾（impeachment）", "def": "議会が高官の不正や職務違反を問い、辞めさせるための手続き。"}, {"term": "国防長官", "def": "米国の軍を管理する国防総省のトップ。トランプ政権では「戦争長官」という呼び方も使われている。"}], "headlines": [{"outlet": "産経新聞", "region": "日本", "lean": "保守寄り", "link": "null/article/20261110-OEV6KXZVY5N7FNRRQPWEVJRHQE/", "title": "ヘグセス米国防長官、自身への弾劾決議案を「破壊工作」と批判 否決に自信"}, {"outlet": "The Hill", "region": "米国", "lean": "中道・政治専門", "link": "https://thehill.com/homenews/house/6210923-bacon-opposes-hegseth-impeachment/", "title": "Bacon plans to vote ‘no’ on Hegseth impeachment"}, {"outlet": "National Review", "region": "米国", "lean": "保守", "link": "https://www.nationalreview.com/2026/11/hegseth-impeachment-vote-imminent/", "title": "Hegseth Impeachment Vote Imminent"}, {"outlet": "Breitbart", "region": "米国", "lean": "右派", "link": "https://www.breitbart.com/national-security/2026/11/10/pete-hegseth-massies-impeachment-effort-is-political-spectacle-farce/", "title": "Pete Hegseth: Massie's Impeachment Effort Is a 'Political Spectacle,' 'Farce'"}, {"outlet": "CBC", "region": "カナダ", "lean": "公共放送", "link": "https://www.cbc.ca/news/world/hegseth-impeachment-resolution-reaction-9.7416083?cmp=rss", "title": "Defiant Hegseth calls Republican's impeachment resolution a 'farce'"}, {"outlet": "ABC News", "region": "豪州", "lean": "公共放送", "link": "https://www.abc.net.au/news/2026-11-11/us-defense-secretary-pete-hegseth-fights-impeachment/107367736", "title": "Pete Hegseth vows to fight 'farce' impeachment push ahead of vote"}, {"outlet": "Al Jazeera", "region": "中東", "lean": "カタール", "link": "https://www.aljazeera.com/news/2026/11/10/hegseth-impeachment-what-is-he-accused-of-and-could-he-be-remov title": "Iran denies role in fridge hack, France summons ambassador"}, {"outlet": "TASS", "region": "ロシア", "lean": "ロシア国営通信", "link": "https://tass.com/world/2215701", "title": "Iran's Supreme National Security Council says Tehran not in talks with Washington"}, {"outlet": "Al Jazeera", "region": "中東", "lean": "カタール", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/10/qatari-pms-washington-visit-comes-amid-renewed-us-iran?traffic_source=rss", "title": "Qatari PM’s Washington visit comes amid renewed US–Iran diplomacy"}, {"outlet": "Straits Times", "region": "シンガポール", "lean": "大手・政府寄り", "link": "https://www.straitstimes.com/world/middle-east/irans-top-security-official-says-no-talks-underway-with-us", "title": "Iran's top security official says no talks underway with US"}, {"outlet": "The Hindu", "region": "インド", "lean": "リベラル寄り", "link": "https://www.thehindu.com/news/international/iran-rejects-frances-baseless-accusations-on-cyberattack/article71686751.ece", "title": "Iran rejects France’s ‘baseless accusations’ on cyberattack"}, {"outlet": "Dawn", "region": "パキスタン", "lean": "リベラル寄り", "link": "https://www.dawn.com/news/2043541/britain-says-its-bases-are-safe-after-us-refuelling-planes-evacuated", "title": "Britain says its bases are safe after US refuelling planes evacuated"}]}, {"id": "israel", "cat": "政治", "region": "世界", "title": "イスラエル新議会が発足、アイゼンコット氏が政権づくりに挑む", "points": ["選挙が「決着つかず」に終わったイスラエルで、新しい議会が宣誓しましたが、新政府はまだできていません。ネタニヤフ首相は過半数を失いました。", "元軍参謀総長のアイゼンコット氏が連立政権づくりを進めています。ヘルツォグ大統領は、再選挙を避けるために協力するよう各党に呼びかけました。"], "background": "イスラエルは多くの政党が議席を分け合うため、いくつもの党が組む連立政権が普通です。どこも過半数を作れなければ再び選挙になります。3年にわたるガザなどでの戦争で国内の分断が深まっています。", "angles": ["Dawn（パキスタン）やDaily Sabah（トルコ）は「ネタニヤフ氏の過半数喪失」を前面に出しています。", "The Hindu・Free Malaysia Todayは通信社の記事で、新議会がネタニヤフ氏を標的にしていると伝えています。"], "terms": [{"term": "クネセト", "def": "イスラエルの国会。一院制で定数は120。"}, {"term": "連立政権", "def": "複数の政党が組んで作る政府。"}], "headlines": [{"outlet": "Washington Post", "region": "米国", "lean": "リベラル寄り", "link": "https://www.washingtonpost.com/world/2026/11/09/israeli-opposition-eyes-deal-with-ultra-orthodox-jewish-parties-oust-netanyahu/", "title": "Israeli opposition eyes deal with ultra-Orthodox Jewish parties to oust Netanyahu"}, {"outlet": "BBC", "region": "英国", "lean": "公共放送", "link": "https://www.bbc.co.uk/news/articles/crd939lpzjp9o?at_medium=RSS&at_campaign=rss", "title": "Israel's new parliament sworn in as leaders compete to form government"}, {"outlet": "The Hindu", "region": "インド", "lean": "リベラル寄り", "link": "https://www.thehindu.com/news/international/new-israeli-parliament-to-take-aim-at-netanyahu-as-eisenkot-seeks-government/article71687117.ece", "title": "New Israeli parliament to take aim at Netanyahu as Eisenkot seeks government"}, {"outlet": "Dawn", "region": "パキスタン", "lean": "リベラル寄り", "link": "https://www.dawn.com/news/2043517/israels-parliament-sworn-in-as-eisenkot-tries-to-forge-a-government", "title": "Israel's parliament sworn in as Eisenkot tries to forge a government"}, {"outlet": "Daily Sabah", "region": "トルコ", "lean": "政府寄り", "link": "https://www.dailysabah.com/world/mid-east/israel-swears-in-new-parliament-as-eisenkot-attempts-to-form-govt", "title": "Israel swears in new parliament as Eisenkot attempts to form govt"}]}, {"id": "cop31", "cat": "環境", "region": "世界", "title": "COP31がトルコで開幕、「電化」が焦点　期待は低めの声も", "points": ["国連の気候変動会議COP31がトルコのアンタルヤで始まりました。2035年までに世界のエネルギーに占める電気の割合を35%に増やすことが大きな目標です。", "EUの気候担当委員は「期待は低い」としつつ、電化に絞れば成果が出せるかもしれないと話しました。途上国は資金の支援を求め、南アフリカが求めた「適応資金3倍」は議題に入りませんでした。"], "background": "COPは毎年開かれる気候変動対策の国際会議です。2015年のパリ協定で、気温上昇を産業革命前から1.5〜2度以内に抑える目標が決まりました。先進国と途上国の間では「誰がどれだけお金を出すか」が毎回の争点です。開催国トルコが油田の発見をアピールしたことも話題になりました。", "angles": ["Japan Timesは日本が環境技術を売り込む場として伝えています。", "Daily Maverick（南アフリカ）は自国の要求が通らなかったことを批判しています。", "Mother Jones（米リベラル）は「化石燃料」という言葉が使われるかに注目しています。", "Dawn（パキスタン）は自国首相の出席、Daily Sabah（トルコ）は開催国の取り組みを伝えています。"], "terms": [{"term": "COP", "def": "気候変動枠組条約の締約国会議。各国が温暖化対策を話し合う。"}, {"term": "電化", "def": "ガソリンやガスで動いていたもの（車・暖房など）を電気で動くものに切り替えること。"}, {"term": "適応", "def": "温暖化の被害（洪水・干ばつなど）に備えて、堤防などで対策すること。排出を減らす「緩和」と対になる言葉。"}], "headlines": [{"outlet": "Japan Times", "region": "日本", "lean": "英字紙", "link": "https://www.japantimes.co.jp/news/2026/11/10/japan/politics/cop31-japan-technologies/", "title": "Japan to use COP31 to showcase environmental technologies"}, {"outlet": "Daily Maverick", "region": "南アフリカ", "lean": "独立系", "link": "https://www.dailymaverick.co.za/article/2026-11-10-sas-triple-adaptation-finance-fails-to-make-cop31-agenda/", "title": "STUMBLING BLOCKS: SA’s triple adaptation finance fails to make COP31 agenda"}, {"outlet": "SCMP", "region": "香港", "lean": "", "link": "https://www.scmp.com/news/world/europe/article/3373987/activist-greta-thunberg-arrives-un-climate-talks-turkey", "title": "Activist Greta Thunberg arrives at UN climate talks in Turkey"}, {"outlet": "The Hindu", "region": "インド", "lean": "リベラル寄り", "link": "https://www.thehindu.com/news/international/eu-climate-chief-wopke-hoekstra-warns-expectations-low-from-cop31-summit/article71686827.ece", "title": "EU climate chief Wopke Hoekstra warns 'expectations low' from COP31 summit"}, {"outlet": "Dawn", "region": "パキスタン", "lean": "リベラル寄り", "link": "https://www.dawn.com/news/2043486/pm-shehbaz-arrives-in-turkiye-to-address-cop31-tomorrow", "title": "PM Shehbaz arrives in Turkiye, to address COP31 tomorrow"}, {"outlet": "Free Malaysia Today", "region": "マレーシア", "lean": "独立系", "link": "https://www.freemalaysiatoday.com/category/world/2026/11/10/nations-urged-to-exit-fossil-fuels-as-turkey-touts-oil-find", "title": "Nations urged to exit fossil fuels as Turkey touts oil find"}, {"outlet": "Bernama", "region": "マレーシア", "lean": "国営通信社", "link": "http://www.bernama.com/en/news.php?id=2632553", "title": "World : COP31 Delegates Call For Urgent Climate Finance, Justice For Developing Nations"}, {"outlet": "Mother Jones", "region": "米国", "lean": "左派", "link": "https://www.motherjones.com/environment/2026/11/cop31-turkey-australia-paris-agreement-fossil-fuels-warming/", "title": "COP31 Is Here. Will Anyone Finally Say “Fossil Fuels”?"}, {"outlet": "Daily Sabah", "region": "トルコ", "lean": "政府寄り", "link": "https://www.dailysabah.com/business/turkiye-honors-sustainability-leaders-at-cop31-in-antalya/news", "title": "Türkiye honors sustainability leaders at COP31 in Antalya"}, {"outlet": "Antara", "region": "インドネシア", "lean": "国営通信", "link": "https://en.antaranews.com/news/441635/indonesia-outlines-three-priorities-to-halt-deforestation-at-cop31", "title": "Indonesia outlines three priorities to halt deforestation at COP31"}]}, {"id": "bulgaria", "cat": "事故", "region": "世界", "title": "ブルガリアの高速道路で濃霧の多重事故、12人死亡", "points": ["ブルガリア南東部の高速道路で、濃い霧のため約50台がからむ多重事故が起き、少なくとも12人が死亡、数十人がけがをしました。首相は服喪の日を宣言しました。"], "background": "霧で前が見えなくなると、速度を落とせなかった車が次々とぶつかる多重衝突が起きやすくなります。ブルガリアはEU加盟国で、道路の安全対策が以前から課題とされてきました。", "angles": ["ABC・Sky News・Al Jazeera・DW・Daily Sabahなど各国のメディアが、ほぼ同じ事実を伝えています。"], "terms": [{"term": "多重事故（pile-up）", "def": "多くの車が連鎖的にぶつかる事故。"}, {"term": "服喪の日", "def": "国全体で犠牲者を悼む日。半旗を掲げるなどする。"}], "headlines": [{"outlet": "ABC News", "region": "豪州", "lean": "公共放送", "link": "https://www.abc.net.au/news/2026-11-11/bulgaria-deadly-pile-up-highway/107371178", "title": "Twelve dead, 50 injured in Bulgarian motorway pile-up in heavy fog"}, {"outlet": "DW", "region": "ドイツ", "lean": "公共放送", "link": "https://www.dw.com/en/bulgaria-highway-pileup-kills-12-dozens-injured-pm/a-79907978?maca=en-rss-en-world-4025-rdf", "title": "Bulgaria highway pileup kills 12, dozens injured: PM"}, {"outlet": "Al Jazeera", "region": "中東", "lean": "カタール", "link": "https://www.aljazeera.com/video/newsfeed/2026/11/10/at-least-12-people-killed-in-bulgaria-motorway-pile-up?traffic_source=rss", "title": "At least 12 people killed in Bulgaria motorway pile-up"}, {"outlet": "Sky News", "region": "英国", "lean": "民放", "link": "https://news.sky.com/story/at-least-12-killed-in-bulgaria-motorway-pile-ups-involving-dozens-of-vehicles-13610553", "title": "At least 12 killed in Bulgaria motorway pile-ups involving dozens of vehicles"}, {"outlet": "Daily Sabah", "region": "トルコ", "lean": "政府寄り", "link": "https://www.dailysabah.com/world/europe/bulgaria-highway-pileup-due-to-dense-fog-kills-12-injures-dozens", "title": "Bulgaria highway pileup due to dense fog kills 12, injures dozens"}, {"outlet": "Korea Herald", "region": "韓国", "lean": "英字紙", "link": "https://www.koreaherald.com/article/10932718", "title": "Eleven dead, fifty injured in Bulgarian highway pileup"}]}, {"id": "uscpi", "cat": "経済", "region": "世界", "title": "米国の物価が予想以上に上昇、12月の利上げ観測が強まる", "points": ["米国の10月の消費者物価指数は前の月より0.4%上がり、予想を上回りました。これを受けて国債が売られ、株価も下がりました。", "ダラス連銀のローガン総裁は「少なくともあと2回の利上げ」が必要だと述べ、12月の利上げはほぼ確実との見方が広がっています。"], "background": "物価が上がり続ける（インフレ）と、お金の価値が下がって生活が苦しくなります。中央銀行（米国ではFRB）は金利を上げてお金を借りにくくし、景気の過熱をおさえて物価を落ち着かせようとします。ただ金利が上がると株や住宅ローンにも響きます。", "angles": ["Financial Timesは国債市場の反応と、利上げの幅が大きくなる可能性を分析しています。", "Daily Wire（保守）は「新しい民主党多数の議会との経済対決」という政治の視点で伝えています。", "FNNは利上げ観測が強まったことを簡潔に伝え、The Edge（マレーシア）は米国株の下落を報じています。"], "terms": [{"term": "消費者物価指数（CPI）", "def": "家計がよく買うモノやサービスの値段の動きを表す指数。インフレの代表的な物差し。"}, {"term": "利上げ", "def": "中央銀行が政策金利を引き上げること。物価上昇をおさえる効果がある。"}, {"term": "国債", "def": "国が発行する借金の証書。売られると価格が下がり、金利（利回り）は上がる。"}], "headlines": [{"outlet": "FNNプライムオンライン", "region": "日本", "lean": "民放（フジ系）", "link": "https://www.fnn.jp/articles/-/1149981", "title": "アメリカの10月消費者物価指数、前月比0.4％上昇 12月利上げの見方強まる"}, {"outlet": "Bloomberg", "region": "米国", "lean": "経済", "link": "https://www.bloomberg.com/news/videos/2026-11-10/fed-s-logan-calls-for-two-more-rate-hikes-video", "title": "Fed's Logan Calls For at Least Two More Rate Hikes"}, {"outlet": "Daily Wire", "region": "米国", "lean": "保守・右派", "link": "https://www.dailywire.com/news/inflation-climbs-as-trump-preps-for-economic-showdown-with-new-dem-majority", "title": "Inflation Climbs As Trump Preps For Economic Showdown With New Dem Majority"}, {"outlet": "Financial Times", "region": "英国", "lean": " <script>
const EMBED = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Kuala_Lumpur'});

/* ---------- 状態（保存データ） ---------- */
const KEY = 'newsbook-v1';
let st = {bookmarks:[], words:[], marks:[]};
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e) {}
let db = null, stateRef = null, remoteReady = false, writing = Promise.resolve(), saveTimer = null;
function setSync(t){ $('#sync').textContent = t; }
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {}
  if(!stateRef || !remoteReady) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = JSON.parse(JSON.stringify(st));
    writing = writing.then(() => stateRef.set(body)).then(() => setSync('どの端末でも同期されます'))
      .catch(e => setSync(e && e.code === 'quota_exceeded' ? '保存の上限に達しました。古い単語を削除してください' : '同期に失敗しました。この端末には保存されています'));
  }, 600);
}

/* ---------- 号（エディション） ---------- */
let D = EMBED, editions = [{date:EMBED.date, count:EMBED.stories.length, titles:EMBED.stories.slice(0,3).map(s=>s.title)}];
const cache = {[EMBED.date]: EMBED};
async function openEdition(date){
  if(!cache[date] && db){
    try { const s = await db.doc('editions/' + date).get(); if(s.exists) cache[date] = s.data(); } catch(e) {}
  }
  if(!cache[date] && window.NEWSBOOK_SITE){
    try { const r = await fetch('editions/' + date + '.json'); if(r.ok) cache[date] = await r.json(); } catch(e) {}
  }
  if(cache[date]){ D = cache[date]; renderEdition(); }
}
function renderEditionSelect(){
  $('#edsel').innerHTML = editions.map(e => `<option value="${esc(e.date)}" ${e.date===D.date?'selected':''}>${esc(e.date.replace(/-/g,'.'))}${e.date===editions[0].date?'（最新）':''}</option>`).join('');
}
$('#edsel').addEventListener('change', e => openEdition(e.target.value));

/* ---------- 今日のニュース ---------- */
const regions = ['すべて','日本','世界','マレーシア'];
let filter = 'すべて';
const isBm = id => st.bookmarks.some(b => b.id === id && b.date === D.date);
const hasWord = t => st.words.some(w => w.term === t);
function applyMarks(html){
  st.marks.forEach(m => { const t = esc(m.text); if(t.length > 1 && html.includes(t)) html = html.split(t).join(`<mark>${t}</mark>`) });
  return html;
}
function renderFilters(){
  $('#filters').innerHTML = regions.map(r => `<button class="chip" type="button" data-r="${r}" aria-pressed="${r===filter}">${r}</button>`).join('') +
    `<button class="chip" type="button" data-r="★" aria-pressed="${filter==='★'}">★ 保存した話題</button>`;
}
$('#filters').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; filter = b.dataset.r; renderFilters(); renderStories(); });
let sample = null;
function renderStories(){
  const list = D.stories.filter(s => filter==='すべて' || (filter==='★' ? isBm(s.id) : s.region===filter));
  $('#stories').innerHTML = list.length ? list.map(s => {
    const outlets = new Set(s.headlines.map(h => h.outlet)).size;
    return `<article class="story" id="s-${esc(s.id)}" data-id="${esc(s.id)}">
      <div class="meta"><span class="reg" data-r="${esc(s.region)}">${esc(s.region)}</span><span>${esc(s.cat)}</span><span class="count">${outlets}媒体が報道</span>
        <button class="star" type="button" data-bm="${esc(s.id)}" aria-pressed="${isBm(s.id)}">${isBm(s.id)?'★ 保存済み':'☆ 保存'}</button></div>
      <h2>${esc(s.title)}</h2>
      <div class="points">${s.points.map(p => `<p>${applyMarks(esc(p))}</p>`).join('')}</div>
      <div class="bg"><h3>背景　なぜ大事？</h3><p>${applyMarks(esc(s.background))}</p></div>
      <div><h3>媒体による見え方の違い</h3><ul class="angles">${s.angles.map(a => `<li>${applyMarks(esc(a))}</li>`).join('')}</ul></div>
      <div class="terms"><h3>用語</h3>${s.terms.map(t => `<div class="term"><b>${esc(t.term)}</b><span>${esc(t.def)}</span>
        <button type="button" data-word="${esc(t.term)}" data-def="${esc(t.def)}" data-story="${esc(s.id)}" aria-pressed="${hasWord(t.term)}">${hasWord(t.term)?'単語帳に追加済み':'単語帳に追加'}</button></div>`).join('')}</div>
      <details><summary>各媒体の見出し（${s.headlines.length}件）</summary><ul class="heads">${s.headlines.map(h =>
        `<li><span class="src">${esc(h.outlet)}<i>${esc(h.region)}${h.lean?'・'+esc(h.lean):''}</i></span><a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.title)}</a></li>`).join('')}</ul></details>
      ${sample ? `<div class="ask"><h3>Claudeに質問する</h3>
        <textarea rows="2" id="q-${esc(s.id)}" placeholder="例：なぜ日本に関係あるの？　中学生にもわかるように説明して"></textarea>
        <div class="row"><button class="btn primary" type="button" data-ask="${esc(s.id)}">質問する</button>
        <button class="btn" type="button" data-ask="${esc(s.id)}" data-preset="この話題をもっと深く理解するために、知っておくべき歴史的な経緯を3つ教えて">歴史的な経緯は？</button>
        <button class="btn" type="button" data-ask="${esc(s.id)}" data-preset="この話題は日本とマレーシアの暮らしにどう関係する？">私の生活との関係は？</button></div>
        <div class="answer" id="a-${esc(s.id)}" hidden></div></div>` : ''}
    </article>`}).join('') : `<p class="empty">まだ保存した話題はありません。気になる話題の「☆ 保存」を押すとここに集まります。</p>`;
}
$('#stories').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.bm){ const id=b.dataset.bm; const s=D.stories.find(x=>x.id===id);
    if(isBm(id)) st.bookmarks = st.bookmarks.filter(x=>!(x.id===id && x.date===D.date)); else st.bookmarks.push({id, title:s.title, date:D.date, savedAt:today()});
    save(); renderStories(); }
  if(b.dataset.word){ const t=b.dataset.word;
    if(hasWord(t)) st.words = st.words.filter(w=>w.term!==t); else st.words.push({term:t, def:b.dataset.def, story:b.dataset.story, storyTitle:(D.stories.find(x=>x.id===b.dataset.story)||{}).title||'', date:D.date, savedAt:today(), known:false});
    save(); renderStories(); }
  if(b.dataset.ask) ask(b.dataset.ask, b.dataset.preset);
});
let asking = null;
async function ask(id, preset){
  const s = D.stories.find(x=>x.id===id); const ta = $('#q-'+id); const out = $('#a-'+id);
  const q = (preset || ta.value).trim(); if(!q || !sample) return;
  if(asking) asking.abort(); asking = new AbortController();
  out.hidden = false; out.textContent = '考えています…';
  const ctx = {title:s.title, points:s.points, background:s.background, angles:s.angles, headlines:s.headlines.map(h=>h.outlet+': '+h.title)};
  const prompt = `あなたは世界のニュースをやさしく教える先生です。読者は世界のことをもっと学びたい大人です。\n次のニュースの話題（${D.date}の各媒体の見出しと要約）について、読者の質問に日本語で答えてください。\n・やさしい言葉で、400字くらいまで。\n・この話題の資料にない最近の出来事は断定せず「〜とみられる」などと書く。\n・一般的な背景知識は使ってよい。\n\n話題の資料:\n${JSON.stringify(ctx)}\n\n質問: ${q}`;
  try {
    const r = await sample(prompt, {signal: asking.signal, onText: u => { out.textContent = u.text; }, cache:false});
    out.textContent = r.text;
    st.marks.push({text:'Q: '+q+' → '+r.text.slice(0,180), story:id, storyTitle:s.title, date:D.date, savedAt:today(), qa:true});
    save();
  } catch(e){
    out.textContent = e && e.code === 'rate_limited' ? '少し時間をおいてからもう一度どうぞ。' : (e && e.code === 'not_granted' ? 'この画面ではClaudeに質問できません。' : '答えを取得できませんでした。');
    if(e && e.code === 'not_granted'){ sample = null; }
  }
}
function renderTops(){
  const order = ['日本','マレーシア','米国','英国','アイルランド','カナダ','欧州','ドイツ','ウクライナ','ロシア','トルコ','中東','アフリカ','南アフリカ','ナイジェリア','中国','香港','台湾','韓国','ベトナム','タイ','フィリピン','インドネシア','シンガポール','インド','パキスタン','豪州','ニュージーランド','アルゼンチン','メキシコ','南米'];
  const rank = r => { const i = order.indexOf(r); return i < 0 ? 99 : i };
  const names = Object.keys(D.tops).sort((a,b)=> rank(D.tops[a].region)-rank(D.tops[b].region));
  $('#tops').innerHTML = names.map(n => { const o=D.tops[n]; return `<div class="outlet"><div class="name">${esc(n)}</div>
    <div class="lean">${esc(o.region)}${o.lean?'・'+esc(o.lean):''}</div><ol>${o.items.map(i=>`<li><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a></li>`).join('')}</ol></div>`}).join('');
  const ok = D.status.filter(s => s.ok && s.fresh > 0).length, ng = D.status.filter(s=>!s.ok).map(s=>s.outlet);
  $('#status').textContent = `取得できた媒体 ${ok}／${D.status.length}` + (ng.length?`（取得できなかった媒体：${ng.join('、')}）`:'') + '。「傾向」は一般的な評価の目安で、記事ごとに違います。';
}
function renderEdition(){
  const t = new Date(D.fetched_at);
  $('#date').textContent = D.date.replace(/-/g,'.') + '　取得 ' + t.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kuala_Lumpur'}) + '（マレーシア時間）';
  $('#nOutlets').textContent = D.status.filter(s => s.ok && s.fresh > 0).length;
  renderEditionSelect(); renderFilters(); renderStories(); renderTops();
  if(!$('#v-swipe').hidden) renderSwipe();
}
const MANUAL=[['朝日新聞','https://www.asahi.com/'],['毎日新聞','https://mainichi.jp/'],['読売新聞','https://www.yomiuri.co.jp/'],['日本経済新聞','https://www.nikkei.com/'],['東京新聞','https://www.tokyo-np.co.jp/'],['共同通信 47NEWS','https://www.47news.jp/'],['時事通信','https://www.jiji.com/'],['NYT','https://www.nytimes.com/'],['NPR','https://www.npr.org/'],['Guardian','https://www.theguardian.com/'],['Reuters','https://www.reuters.com/'],['AP','https://apnews.com/'],['France 24','https://www.france24.com/en/'],['CNA','https://www.channelnewsasia.com/'],['Nikkei Asia','https://asia.nikkei.com/'],['New Straits Times','https://www.nst.com.my/']];
$('#manual').innerHTML = MANUAL.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join('　');

/* ---------- マーカー ---------- */
const selbtn = $('#selbtn'); let selText = '', selStory = '';
document.addEventListener('selectionchange', () => setTimeout(() => {
  const sel = getSelection(); const t = sel ? sel.toString().trim() : '';
  const node = sel && sel.anchorNode ? (sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement) : null;
  const art = node && node.closest('article.story');
  if(!t || t.length < 2 || t.length > 200 || !art){ selbtn.hidden = true; return; }
  selText = t; selStory = art.dataset.id;
  const r = sel.getRangeAt(0).getBoundingClientRect();
  selbtn.style.top = (scrollY + r.bottom + 8) + 'px';
  selbtn.style.left = Math.max(16, Math.min(scrollX + r.left, document.documentElement.clientWidth - 140)) + 'px';
  selbtn.hidden = false;
}, 0));
selbtn.addEventListener('mousedown', e => e.preventDefault());
selbtn.addEventListener('click', () => {
  if(!st.marks.some(m=>m.text===selText)) st.marks.push({text:selText, story:selStory, storyTitle:(D.stories.find(x=>x.id===selStory)||{}).title||'', date:D.date, savedAt:today()});
  save(); selbtn.hidden = true; getSelection().removeAllRanges(); renderStories();
});

/* ---------- 単語帳 ---------- */
let wtab = 'words';
function renderWords(){
  const tabs = [['words',`単語 ${st.words.length}`],['marks',`マーカー・質問 ${st.marks.length}`],['bm',`保存した話題 ${st.bookmarks.length}`]];
  $('#wtabs').innerHTML = tabs.map(([k,l]) => `<button class="chip" type="button" data-t="${k}" aria-pressed="${k===wtab}">${l}</button>`).join('');
  let h = '';
  const rev = a => a.map((x,i)=>[x,i]).reverse();
  if(wtab==='words') h = st.words.length ? `<div class="list">${rev(st.words).map(([w,i])=>`<div class="item"><b>${esc(w.term)}</b><span>${esc(w.def)}</span>${w.known?'<span class="known">覚えた</span>':''}<small>${esc(w.date||'')}${w.storyTitle?'・'+esc(w.storyTitle):''}</small><button class="rm" type="button" data-rm="words" data-i="${i}">削除</button></div>`).join('')}</div>` : `<p class="empty">用語の「単語帳に追加」か、上のフォームで単語をためられます。</p>`;
  if(wtab==='marks') h = st.marks.length ? `<div class="list">${rev(st.marks).map(([m,i])=>`<div class="item"><span>${m.qa?esc(m.text):`<mark>${esc(m.text)}</mark>`}</span><small>${esc(m.date||'')}${m.storyTitle?'・'+esc(m.storyTitle):''}</small><button class="rm" type="button" data-rm="marks" data-i="${i}">削除</button></div>`).join('')}</div>` : `<p class="empty">記事の文章を選んで「マーカーで保存」を押すとここにたまります。Claudeへの質問と答えもここに残ります。</p>`;
  if(wtab==='bm') h = st.bookmarks.length ? `<div class="list">${rev(st.bookmarks).map(([b,i])=>`<div class="item"><a href="#today" data-go="${esc(b.date)}">${esc(b.title)}</a><small>${esc(b.date)}</small><button class="rm" type="button" data-rm="bookmarks" data-i="${i}">削除</button></div>`).join('')}</div>` : `<p class="empty">話題の「☆ 保存」を押すとここにたまります。</p>`;
  $('#wbody').innerHTML = h;
}
$('#wtabs').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; wtab=b.dataset.t; renderWords(); });
$('#wbody').addEventListener('click', e => {
  const b = e.target.closest('button,a'); if(!b) return;
  if(b.dataset.rm){ st[b.dataset.rm].splice(+b.dataset.i,1); save(); renderWords(); }
  if(b.dataset.go){ openEdition(b.dataset.go); }
});
$('#addword').addEventListener('submit', e => {
  e.preventDefault(); const t = $('#aw-term').value.trim(); if(!t) return;
  st.words = st.words.filter(w=>w.term!==t);
  st.words.push({term:t, def:$('#aw-def').value.trim(), date:today(), savedAt:today(), known:false, own:true});
  $('#aw-term').value=''; $('#aw-def').value=''; save(); renderWords();
});

/* ---------- ふりかえり ---------- */
let qi = 0, reveal = false;
function weekAgo(){ const d = new Date(); d.setDate(d.getDate()-7); return d.toLocaleDateString('sv-SE',{timeZone:'Asia/Kuala_Lumpur'}); }
function renderReview(){
  const w0 = weekAgo();
  const wkWords = st.words.filter(w => (w.savedAt||w.date||'') >= w0);
  const wkBm = st.bookmarks.filter(b => (b.savedAt||b.date||'') >= w0);
  const wkMarks = st.marks.filter(m => (m.savedAt||m.date||'') >= w0);
  const known = st.words.filter(w=>w.known).length;
  $('#rstats').innerHTML = [[wkWords.length,'今週ためた単語'],[wkBm.length,'今週保存した話題'],[wkMarks.length,'今週のマーカー・質問'],[`${known}/${st.words.length}`,'覚えた単語']]
    .map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  const pool = st.words.filter(w=>!w.known);
  if(!st.words.length){ $('#rcard').innerHTML = `<p class="empty">単語をためると、ここで暗記カードとしてふりかえれます。</p>`; }
  else if(!pool.length){ $('#rcard').innerHTML = `<p class="empty">全部「覚えた」になりました。新しい単語をためていきましょう。</p>`; }
  else {
    const w = pool[qi % pool.length];
    $('#rcard').innerHTML = `<div class="card"><small>まだ覚えていない単語 ${(qi%pool.length)+1}／${pool.length}</small>
      <div class="q">${esc(w.term)}</div>${reveal?`<div class="a">${esc(w.def||'（メモなし）')}</div>${w.storyTitle?`<small>${esc(w.storyTitle)}</small>`:''}`:`<div class="a">意味を思い出してから、めくってみましょう。</div>`}
      <div class="tabs">${reveal?`<button class="chip" type="button" data-q="known">覚えた</button><button class="chip" type="button" data-q="next">まだ</button>`:`<button class="chip" type="button" data-q="flip">めくる</button>`}</div></div>`;
  }
  $('#rbm').innerHTML = wkBm.length ? wkBm.map(b=>`<div class="item"><a href="#today" data-go="${esc(b.date)}">${esc(b.title)}</a><small>${esc(b.date)}</small></div>`).join('') : `<p class="empty">今週保存した話題はまだありません。</p>`;
}
$('#rcard').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const pool = st.words.filter(w=>!w.known); const w = pool[qi % pool.length];
  if(b.dataset.q==='flip'){ reveal = true; }
  if(b.dataset.q==='next'){ qi++; reveal = false; }
  if(b.dataset.q==='known' && w){ w.known = true; w.knownAt = today(); reveal = false; save(); }
  renderReview();
});
$('#rbm').addEventListener('click', e => { const a=e.target.closest('a'); if(a && a.dataset.go) openEdition(a.dataset.go); });

/* ---------- 過去の号 ---------- */
function renderArchive(){
  $('#arch').innerHTML = editions.map(e => `<a href="#today" data-go="${esc(e.date)}"><small>${esc(e.date.replace(/-/g,'.'))}・${e.count}話題</small>${(e.titles||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</a>`).join('');
}
$('#arch').addEventListener('click', e => { const a=e.target.closest('a'); if(a && a.dataset.go) openEdition(a.dataset.go); });


/* ---------- サクッと（スワイプ） ---------- */
let si = 0, sdate = null, kept = 0, stab = 'すべて';
const STABS = ['すべて','日本','マレーシア','世界','経済'];
function swipeList(){
  return D.stories.filter(s => stab==='すべて' || (stab==='経済' ? /経済|ビジネス|市場|金融/.test(s.cat) : s.region===stab));
}
function renderStabs(){
  $('#stabs').innerHTML = STABS.map(t => { const n = t==='すべて' ? D.stories.length : (() => { const k = stab; stab = t; const c = swipeList().length; stab = k; return c; })();
    return `<button class="chip" type="button" data-st="${t}" aria-pressed="${t===stab}">${t} ${n}</button>`; }).join('');
}
function shortText(t, n){ t = String(t||''); return t.length > n ? t.slice(0, n) + '…' : t; }
function cardHTML(s, cls){
  const t = s.terms && s.terms[0];
  const outlets = new Set(s.headlines.map(h => h.outlet)).size;
  return `<div class="scard ${cls}" data-id="${esc(s.id)}"><span class="stamp yes">あとで読む</span><span class="stamp no">とばす</span>
    <div class="meta"><span class="reg" data-r="${esc(s.region)}">${esc(s.region)}</span><span>${esc(s.cat)}</span><span class="count">${outlets}媒体</span></div>
    <h2>${esc(s.title)}</h2><p class="lead">${esc(shortText(s.points[0], 120))}</p>
    ${t ? `<div class="kt">今日の用語　<b>${esc(t.term)}</b>：${esc(shortText(t.def, 60))}</div>` : ''}</div>`;
}
function renderSwipe(){
  if(sdate !== D.date){ sdate = D.date; si = 0; kept = 0; }
  renderStabs();
  const list = swipeList(), deck = $('#deck');
  $('#sprog').textContent = si < list.length ? `${D.date.replace(/-/g,'.')}　${si+1}／${list.length}` : '';
  $('#sbtns').hidden = si >= list.length;
  if(si >= list.length){
    deck.innerHTML = `<div class="scard" style="cursor:default;justify-content:center;align-items:center;text-align:center">
      <h2>${stab==='すべて'?'今朝の':stab+'の'}${list.length}話題を見終わりました</h2><p class="lead">「あとで読む」にしたのは ${kept} 件です。</p>
      <div class="sbtns"><button type="button" class="keep" data-s="read">保存した話題を読む</button><button type="button" data-s="again">もう一度</button></div></div>`;
    return;
  }
  deck.innerHTML = (list[si+1] ? cardHTML(list[si+1], 'back') : '') + cardHTML(list[si], 'front');
  bindDrag(deck.querySelector('.front'));
}
function swipeDone(dir){
  const s = swipeList()[si]; if(!s) return;
  if(dir === 'keep'){ if(!isBm(s.id)){ st.bookmarks.push({id:s.id, title:s.title, date:D.date, savedAt:today()}); save(); } kept++; }
  const card = $('#deck .front');
  if(card){ card.classList.add('anim'); card.style.transform = `translateX(${dir==='keep'?120:-120}%) rotate(${dir==='keep'?18:-18}deg)`; card.style.opacity = '0'; }
  si++; setTimeout(renderSwipe, 230);
}
function openStory(id){ filter = 'すべて'; location.hash = '#today'; setTimeout(() => { const el = document.getElementById('s-'+id); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 60); }
function bindDrag(card){
  if(!card) return;
  let x0 = null, y0 = 0, dx = 0, moved = false;
  const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
  card.addEventListener('pointerdown', e => { x0 = e.clientX; y0 = e.clientY; dx = 0; moved = false; card.setPointerCapture(e.pointerId); card.classList.remove('anim'); });
  card.addEventListener('pointermove', e => {
    if(x0 === null) return; dx = e.clientX - x0;
    if(Math.abs(dx) > 6) moved = true;
    card.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx/90)); no.style.opacity = Math.max(0, Math.min(1, -dx/90));
  });
  const end = () => {
    if(x0 === null) return; x0 = null;
    if(dx > 90) return swipeDone('keep');
    if(dx < -90) return swipeDone('skip');
    card.classList.add('anim'); card.style.transform = ''; yes.style.opacity = 0; no.style.opacity = 0;
    if(!moved) openStory(card.dataset.id);
  };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
}
$('#v-swipe').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.s === 'keep' || b.dataset.s === 'skip') swipeDone(b.dataset.s);
  if(b.dataset.st){ stab = b.dataset.st; si = 0; kept = 0; renderSwipe(); return; }
  if(b.dataset.s === 'more' && swipeList()[si]) openStory(swipeList()[si].id);
  if(b.dataset.s === 'again'){ si = 0; kept = 0; renderSwipe(); }
  if(b.dataset.s === 'read'){ filter = '★'; location.hash = '#today'; }
});
addEventListener('keydown', e => {
  if($('#v-swipe').hidden || e.target.closest('input,textarea,select')) return;
  if(e.key === 'ArrowRight') swipeDone('keep');
  if(e.key === 'ArrowLeft') swipeDone('skip');
});

/* ---------- 画面切り替え ---------- */
const VIEWS = ['swipe','today','words','review','archive'];
function route(){
  const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'swipe';
  VIEWS.forEach(x => { $('#v-'+x).hidden = x !== v; });
  document.querySelectorAll('.appnav a').forEach(a => a.setAttribute('aria-current', a.dataset.v===v ? 'page' : 'false'));
  if(v==='words') renderWords(); if(v==='review') renderReview(); if(v==='archive') renderArchive();
  if(v==='today'){ renderFilters(); renderStories(); }
  if(v==='swipe') renderSwipe();
}
addEventListener('hashchange', () => { route(); scrollTo(0,0); });
renderEdition(); route();
setSync('この端末に保存しています');

/* ---------- サイト版：号の一覧をファイルから読む ---------- */
if(window.NEWSBOOK_SITE){
  fetch('editions/index.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null).then(j => {
    const list = (j && j.editions || []).slice().sort((a,b)=> b.date.localeCompare(a.date));
    if(!list.length) return;
    editions = list; renderEditionSelect(); if(!$('#v-archive').hidden) renderArchive();
    if(list[0].date !== D.date) openEdition(list[0].date);
  }).catch(() => {});
}

/* ---------- サーバー連携（使えるときだけ） ---------- */
(async () => {
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [dbNs, userNs, sampleNs] = await Promise.all([use('db'), use('user'), use('sample')]);
  if(sampleNs){ sample = sampleNs; renderStories(); }
  if(!dbNs) return;
  db = dbNs;
  db.doc('meta/index').onSnapshot(snap => {
    if(!snap.exists) return;
    const list = (snap.data().editions || []).slice().sort((a,b)=> b.date.localeCompare(a.date));
    if(!list.length) return;
    const wasLatest = D.date === editions[0].date;
    editions = list; renderEditionSelect(); if(!$('#v-archive').hidden) renderArchive();
    if(wasLatest && list[0].date !== D.date) openEdition(list[0].date);
  }, () => {});
  const uid = userNs ? await userNs.id() : null;
  if(!uid){ setSync('サインインすると、どの端末でも同期されます'); return; }
  stateRef = db.doc('data/users/' + uid + '/state');
  const timer = setTimeout(() => setSync('同期先につながりません。この端末には保存しています'), 10000);
  stateRef.onSnapshot(snap => {
    if(snap.metadata.hasPendingWrites) return;
    clearTimeout(timer);
    if(!remoteReady){
      remoteReady = true;
      if(!snap.exists){ save(); setSync('どの端末でも同期されます'); return; }
    }
    if(snap.exists){
      const d = snap.data();
      st = {bookmarks: d.bookmarks || [], words: d.words || [], marks: d.marks || []};
      try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {}
      setSync('どの端末でも同期されます');
      route();
    }
  }, () => { clearTimeout(timer); setSync('同期できません。この端末には保存しています'); });
})();
</script>
</body></html>
